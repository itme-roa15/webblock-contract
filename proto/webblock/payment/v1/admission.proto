// DRAFT, proposed by project, waits for payment. Owner: payment.
// Serves Project FR-11, FR-12, FR-26, PR-7, PR-15. Shape from Project's payment-contract.md sections 2.1 to 2.3.
// Transport: gRPC (owner ruling C1), as Notion "Web Block architecture" 5.1 names these methods. Project's HTTP calls
// (POST /internal/v1/website-admissions, DELETE /internal/v1/website-admissions/{projectId},
// POST /internal/v1/generation-admissions) move to these methods. Releasing a deleted website's admission frees its
// slot in the client's current plan (owner ruling A2). Open points before ACCEPTED:
//   1. HTTP 409 PROJECT_IN_USE has no row in Notion table 2.3; proposed FAILED_PRECONDITION.
//   2. ReleaseWebsiteAdmission names the project only, not one admission (known limit on Project's side).
//   3. A refusal of AdmitGenerationAttempt "has the same shape as 2.1": read here as decision and reason only.
syntax = "proto3";
package webblock.payment.v1;

// Called by Project only. Deadline 2 s. AdmitWebsite and AdmitGenerationAttempt are idempotent on their key and safe
// to retry on UNAVAILABLE, at most 2 times. A caller with no answer fails closed (PAYMENT_UNAVAILABLE).
// A repeat with the same key and the same body answers the first decision, even if limits changed since.
// The same key with another body: ALREADY_EXISTS with ErrorInfo.reason IDEMPOTENCY_CONFLICT.
service AdmissionService {
  // Before Project creates a project. Key: project_id. ADMITTED records project_created usage.
  // A refusal records nothing; a later repeat is decided again.
  rpc AdmitWebsite(AdmitWebsiteRequest) returns (AdmitWebsiteResponse);

  // Only when Project definitively did not create the admitted project. Frees the slot.
  // NOT_FOUND with ErrorInfo.reason NOT_ADMITTED when no admission exists.
  // ErrorInfo.reason PROJECT_IN_USE when Payment has seen later usage for the project (open point 1).
  rpc ReleaseWebsiteAdmission(ReleaseWebsiteAdmissionRequest) returns (ReleaseWebsiteAdmissionResponse);

  // After Project captured a generation request, before it sends it to AI Codegen. Key: generation_request_id,
  // also the usage event_key. ADMITTED records generation_attempt usage, never credited back.
  rpc AdmitGenerationAttempt(AdmitGenerationAttemptRequest) returns (AdmitGenerationAttemptResponse);
}

enum AdmissionDecision {
  ADMISSION_DECISION_UNSPECIFIED = 0;
  ADMISSION_DECISION_ADMITTED = 1;
  ADMISSION_DECISION_REFUSED = 2;     // a normal answer, not an error
}

message AdmitWebsiteRequest {
  string client_user_id = 1;  // UUID
  string project_id = 2;      // UUID, generated by Project before the call
}

message AdmitWebsiteResponse {
  AdmissionDecision decision = 1;
  string reason = 2;          // empty when ADMITTED, else "WEBSITE_LIMIT_REACHED", "TRIAL_ENDED", "NO_ACTIVE_PLAN",
                              // "CLIENT_SUSPENDED"
  string project_id = 3;
  string plan_code = 4;       // for example "trial", "pro"
  int64 websites_used = 5;
  int64 websites_limit = 6;
}

message ReleaseWebsiteAdmissionRequest {
  string project_id = 1;      // UUID
}

message ReleaseWebsiteAdmissionResponse {
}

message AdmitGenerationAttemptRequest {
  string client_user_id = 1;          // UUID
  string project_id = 2;              // UUID
  string generation_request_id = 3;   // UUID
}

message AdmitGenerationAttemptResponse {
  AdmissionDecision decision = 1;
  string reason = 2;                  // empty when ADMITTED, else "TRIAL_GENERATION_LIMIT_REACHED", "TRIAL_ENDED",
                                      // "NO_ACTIVE_PLAN", "CLIENT_SUSPENDED", "PROJECT_NOT_ADMITTED"; a later reason
                                      // is stored by Project in lower case if it matches [a-z_]{1,64}
  optional int64 attempts_used = 3;   // absent when the plan has no generation limit
  optional int64 attempts_limit = 4;  // absent when the plan has no generation limit
}
