// DRAFT, proposed by provisioning, waits for project. Owner: project.
// Project's answer (PR-18): accepted as written. Open points before ACCEPTED:
//   1. clone_url: Project stores no URL. It would build one from a configured Gitea base and full_name.
//      Which host: the in-cluster Gitea, or the Cloudflare Access address Jenkins clones through?
//   2. Commit SHA: the answer carries none, so Project does not confirm the commit of a request.
//   3. Unknown or deleted project: proposed NOT_FOUND with REPOSITORY_NOT_FOUND, as for no repository.
//   4. Mesh caller: provisioning-build-worker only (Notion "Web Block architecture" 3.8).
syntax = "proto3";
package webblock.project.v1;

// Called by Provisioning's build worker. Deadline 2 s. Safe to retry on UNAVAILABLE, at most 2 times.
service RepositoryService {
  // NOT_FOUND with ErrorInfo.reason REPOSITORY_NOT_FOUND when the project has no repository.
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);
}

message GetRepositoryRequest {
  string project_id = 1;      // UUID
}

message GetRepositoryResponse {
  int64 repository_id = 1;    // Gitea repository ID, 1 to 2^53-1
  string clone_url = 2;       // what the build system clones
  string full_name = 3;       // "<owner>/<repo>", for logs only
  string subdomain = 4;       // DNS label, 1 to 63
}
