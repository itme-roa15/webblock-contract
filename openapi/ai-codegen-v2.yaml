openapi: 3.1.0
info:
  title: WebBlock AI Codegen API
  version: 2.0.0
  description: |
    OWNED BY ai_codegen. Consumer: the web UI (`webblock-web-ui`, `src/features/editor/api.ts`, `sendAiMessage`).

    Version 2 of AI Codegen's public API (owner's decision of 10 November 2026, COMMON.md section 3):
    - Paths are resources, with no client segment (`ui/`).
    - Bodies are bare camelCase objects (no `{success, data}` envelope) shaped like the UI's types.
    - Lists are `Page<T>` with a zero-based `page`.
    - Errors are RFC 9457 problem details with `type` `urn:webblock:problem:<code>`.

    v1 stays as it is and is deprecated. Each operation names the v1 route it replaces in `x-replaces`.

    The service serves these paths under their full prefix `/api/ai-codegen/v2`, so the gateway forwards them unchanged
    (no prefix strip, unlike v1).

    **Authorization.** Every operation needs a Keycloak access token (`Authorization: Bearer`). The caller is the token's
    `sub`, never an id in the request. A project-scoped call checks on the server that the caller may manage
    `{projectId}` (Project's access check, action `manage_site`, which fails closed). A project the caller does not
    manage answers 404, exactly like an unknown one, so project ids don't leak. The admin role grants nothing here.
x-needs-from-project:
  description: |
    ACCEPTED by project on 10 November 2026, with its additions; the source of truth is now Project's
    `openapi/project-v2.yaml` (`x-internal-routes`). End-to-end test issue 9; UI inventory open question 6.

    The chat (`sendAiMessage`) needs the project's current draft page, and its edit has to reach that draft so the
    editor shows it. Today AI Codegen calls `GET /internal/v1/projects/{id}`, which Project doesn't serve, and it edits
    only its own copy of the page. Proposed Project internal routes:
    - mesh only, never through the gateway;
    - the mesh's workload identity is the gate (caller `ai-codegen`), no token;
    - bodies are bare, errors are problem details as in Project v2.

    The owner check stays where it is: AI Codegen asks `POST /internal/v1/access-checks` (`manage_site`) before
    either call. `userId` in the PUT is for Project's activity log, not for authorization.
  routes:
    - route: GET /internal/v1/projects/{projectId}/page
      callers: [ai-codegen]
      purpose: The page the assistant edits, with the revision its change set is made against.
      answer:
        status: 200
        example: '{"projectId": "6c17b5d1-a784-4987-89ff-86079305776b", "name": "Sok Coffee", "componentCatalogVersion": "1.0.0", "editRevision": 7, "draft": {"root": {"props": {}}, "content": []}}'
        schema:
          type: object
          required: [projectId, name, componentCatalogVersion, editRevision, draft, updatedAt]
          properties:
            projectId: {type: string, format: uuid}
            name: {type: string}
            componentCatalogVersion: {type: string}
            editRevision: {type: integer, minimum: 0, description: "The same revision as the draft's `ETag` in Project v2."}
            draft: {type: object, description: The saved draft as a Puck document (Project v2 `PageData`).}
            updatedAt: {type: string, format: date-time}
      errors:
        - "404 PROJECT_NOT_FOUND: no such project, or it is deleted. A suspended project still answers 200."
    - route: PUT /internal/v1/projects/{projectId}/page/draft
      callers: [ai-codegen]
      purpose: |
        Saves the assistant's applied change set as the new draft, only if the draft is still at
        `expectedEditRevision`. Project bumps the revision, as for an owner's save, and records the edit in the project's
        activity (actor `userId`, source AI chat).
      body:
        type: object
        required: [draft, expectedEditRevision, changeSetId, userId]
        properties:
          draft: {type: object, description: The whole new Puck document.}
          expectedEditRevision: {type: integer, minimum: 0}
          changeSetId: {type: string, format: uuid, description: "AI Codegen's change set, for the activity log and for idempotency: the same changeSetId again answers the first save's 200."}
          userId: {type: string, format: uuid, description: The owner who sent the prompt (the token's sub).}
      answer:
        status: 200
        example: '{"editRevision": 8, "updatedAt": "2026-11-10T08:15:10Z"}'
        schema:
          type: object
          required: [editRevision, updatedAt]
          properties:
            editRevision: {type: integer}
            updatedAt: {type: string, format: date-time}
      errors:
        - "404 PROJECT_NOT_FOUND: no such project, or it is deleted."
        - "409 STALE_EDIT_REVISION: the draft is no longer at expectedEditRevision. AI Codegen then rejects its change set, and the chat reply says nothing was changed and why."
        - "409 IDEMPOTENCY_KEY_REUSED: a different body under a changeSetId already used."
        - "400 VALIDATION_FAILED: the body is malformed. 400 PUCK_TREE_INVALID: the draft breaks the component catalog's rules (field errors in errors)."
        - "422 PROJECT_READ_ONLY: the website is suspended or deleted, as for the owner's own save."
servers:
  - url: /api/ai-codegen/v2
security:
  - bearerAuth: []
tags:
  - name: ai-messages
    description: The project's WebBlock AI design assistant chat.
  - name: generation-runs
    description: Code generation runs and their output.
  - name: conversations
    description: Design assistant conversations and their messages.
  - name: change-sets
    description: The page edits the assistant proposes.
paths:
  /projects/{projectId}/ai-messages:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAiMessages
      tags: [ai-messages]
      summary: The project's AI chat, one page at a time
      description: Every message of the project's design assistant conversation, the owner's prompts and the assistant's replies, oldest first by default.
      x-replaces: "GET /v1/ui/projects/{project_id}/ai/messages"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          description: "`createdAt,asc` (default, oldest first) or `createdAt,desc`."
          schema:
            type: string
            enum: ["createdAt,asc", "createdAt,desc"]
            default: "createdAt,asc"
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMessagePage"
              example:
                items:
                  - { id: "0b7e9c1e-4f43-4c7b-9a51-3f3e4a2b9d10", role: USER, text: "Make the hero dark", createdAt: "2026-11-10T08:15:02Z" }
                  - { id: "6a0f2d44-1c9b-4e5f-8d1e-7b2c3a4d5e6f", role: ASSISTANT, text: "I gave the hero a dark background.", createdAt: "2026-11-10T08:15:09Z" }
                page: 0
                size: 20
                totalItems: 2
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: sendAiMessage
      tags: [ai-messages]
      summary: Ask WebBlock AI to edit the site
      description: |
        Stores the owner's prompt, asks the model, and stores and returns the assistant's reply. The project's
        conversation is created on the first message.

        The edit the assistant proposes is applied to the project's draft page as one change set, against the page's
        current edit revision. The reply says what changed. When no change reaches the page, the reply never
        claims one: it is "Nothing on your page was changed: <why>. You can ask again, or describe the change
        another way." The reasons:
        - the edit is one the page doesn't allow;
        - no edit was proposed;
        - the page changed while the model was answering;
        - the website is suspended;
        - the change couldn't be saved.

        The answer is the assistant's reply, a new message: `201` with `Location` pointing at it. The owner's own
        prompt is the message just before it in the list.

        When the model fails, the prompt stays stored, unanswered, as the conversation's last message. An unusable
        reply is asked once more by the service itself; if it still can't be used, the answer is `502`
        `MODEL_REPLY_UNUSABLE` and the client may offer Retry. Sending the same prompt again (equal once trimmed)
        while it is still the last message answers that stored prompt instead of storing it twice.
      x-replaces: "POST /v1/ui/projects/{project_id}/ai/messages"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAiMessage"
            example:
              prompt: Improve the layout and colors of our shop homepage
      responses:
        "201":
          description: The assistant's reply.
          headers:
            Location:
              description: "`/api/ai-codegen/v2/projects/{projectId}/ai-messages/{id}` of the reply."
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMessage"
              example: { id: "6a0f2d44-1c9b-4e5f-8d1e-7b2c3a4d5e6f", role: ASSISTANT, text: "I gave the hero a dark background.", createdAt: "2026-11-10T08:15:09Z" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "502": { $ref: "#/components/responses/ModelReplyUnusable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/ai-messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAiMessage
      tags: [ai-messages]
      summary: One message of the project's AI chat
      description: The target of `Location` after `sendAiMessage`. A message of another project answers 404.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMessage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listGenerationRuns
      tags: [generation-runs]
      summary: The project's generation runs, newest first by default
      description: Each run without its log; read one run for the log.
      x-replaces: "GET /v1/generation-runs"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,desc", "createdAt,asc"], default: "createdAt,desc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationRunPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGenerationRun
      tags: [generation-runs]
      summary: One generation run, with its log
      x-replaces: "GET /v1/generation-runs/{run_id}"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs/{runId}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGenerationRunFiles
      tags: [generation-runs]
      summary: The source the run produced
      description: Every file of the generated site, sorted by path. An empty array when the run produced none.
      x-replaces: "GET /v1/generation-runs/{run_id}/files"
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs/{runId}/check-report:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGenerationRunCheckReport
      tags: [generation-runs]
      summary: The run's check report
      description: The report as the run stored it (`summary`, `changed_files` and the checks). 404 while the run has none.
      x-replaces: "GET /v1/generation-runs/{run_id}/check-report"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listConversations
      tags: [conversations]
      summary: The project's design assistant conversations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,desc", "createdAt,asc"], default: "createdAt,desc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a conversation
      description: Owned by the caller (the token's `sub`). Answers 201 with `Location`.
      x-replaces: ["POST /v1/projects/{project_id}/conversations", "POST /v1/conversations"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversation" }
      responses:
        "201":
          description: The new conversation.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConversation
      tags: [conversations]
      summary: One conversation
      description: Its messages and change sets are the two lists below it (v1 embedded them).
      x-replaces: "GET /v1/conversations/{conversation_id}"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: The conversation's messages, oldest first by default
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,asc", "createdAt,desc"], default: "createdAt,asc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: sendConversationMessage
      tags: [conversations]
      summary: Ask the assistant
      description: |
        Stores the prompt, asks the model about the project's current draft, and answers 201 with the reply, the change
        set it proposes and a warning when its proposal was invalid (then no change set). The change set is only
        proposed: PATCH it to apply it. `Location` is the reply. Model failures, the stored prompt and Retry are as for
        `POST /projects/{projectId}/ai-messages`.
      x-replaces: "POST /v1/conversations/{conversation_id}/messages"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendAiMessage" }
      responses:
        "201":
          description: The assistant's turn.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTurn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/ModelReplyUnusable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConversationMessage
      tags: [conversations]
      summary: One message
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}/change-sets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listConversationChangeSets
      tags: [change-sets]
      summary: The change sets the assistant proposed in this conversation
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,asc", "createdAt,desc"], default: "createdAt,asc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/change-sets/{changeSetId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: changeSetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getChangeSet
      tags: [change-sets]
      summary: One change set
      x-replaces: "GET /v1/change-sets/{change_set_id}"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: decideChangeSet
      tags: [change-sets]
      summary: Apply or discard a proposed change set
      description: |
        `APPLIED` saves it as the project's draft through Project (`PUT /internal/v1/projects/{id}/page/draft`) and
        answers the change set with `appliedEditRevision`; `DISCARDED` drops it. 409 when it is no longer `PROPOSED` or
        the page changed since it was proposed (`rejectionCode` `STALE_EDIT_REVISION`); 422 when Project refuses the
        page (`PROJECT_READ_ONLY`, `PUCK_TREE_INVALID`); 503 when Project is down (it stays `PROPOSED`, retry).
      x-replaces: "PATCH /v1/change-sets/{change_set_id}"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideChangeSet" }
      responses:
        "200":
          description: The decided change set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token of the WebBlock realm.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    AiMessage:
      description: "One message of the WebBlock AI chat: the UI's `AiMessage` (`src/features/editor/types.ts`)."
      type: object
      additionalProperties: false
      required: [id, role, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        text: { type: string }
        createdAt: { type: string, format: date-time, description: ISO 8601 in UTC, with `Z`. }
    AiMessagePage:
      description: "`Page<AiMessage>` (`src/lib/api/types.ts`)."
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AiMessage" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    SendAiMessage:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000, description: What the owner wants changed. }
        pageId:
          type: [string, "null"]
          format: uuid
          description: The page to edit. Absent or null means the home page. The UI doesn't send it today.
    Problem:
      description: RFC 9457 problem details. The UI shows `title` and `detail` and branches on `status`.
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: "`urn:webblock:problem:<code>`, for example `urn:webblock:problem:not-found`."
        title: { type: string, description: A short summary of the problem type. }
        status: { type: integer }
        detail: { type: string, description: What went wrong this time. It never echoes the request or a token. }
        instance: { type: string, description: The request path. }
        code: { type: string, description: "The code of `type` in UPPER_SNAKE, for example `NOT_FOUND`." }
        requestId: { type: string, description: The caller's `X-Request-Id`, or a new one. }
    GenerationRun:
      type: object
      required: [id, projectId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        generationRequestId: { type: [string, "null"], format: uuid }
        flow: { type: string, enum: [INITIAL_GENERATION, EXISTING_APP_UPDATE] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        step: { type: [string, "null"], description: "The pipeline step the run is at (PREPARE, AI_CODE_UPDATE, BUILD, GITHUB_PUSH, DEPLOY), or DONE." }
        attempt: { type: integer }
        strategy: { type: [string, "null"] }
        modelName: { type: [string, "null"] }
        inputTokens: { type: [integer, "null"] }
        outputTokens: { type: [integer, "null"] }
        errorCode: { type: [string, "null"] }
        errors: { type: [string, "null"] }
        commitSha: { type: [string, "null"] }
        promoted: { type: boolean, description: The request accepted this run's result. }
        repositoryUrl: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        changedFiles: { type: array, items: { type: string } }
        validations: { type: array, items: { $ref: "#/components/schemas/Validation" } }
        deployment:
          oneOf: [{ $ref: "#/components/schemas/Deployment" }, { type: "null" }]
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        log: { type: string, description: Only on getGenerationRun. }
    Validation:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        attempt: { type: integer }
        required: { type: boolean }
        status: { type: string, enum: [RUNNING, PASSED, FAILED, SKIPPED] }
        error: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    Deployment:
      type: object
      properties:
        releaseId: { type: string, format: uuid }
        status: { type: [string, "null"] }
        deployStatus: { type: [string, "null"] }
        hostingStatus: { type: [string, "null"] }
        live: { type: boolean }
        failureCode: { type: [string, "null"] }
        failureSummary: { type: [string, "null"] }
        promotedAt: { type: [string, "null"], format: date-time }
    GenerationRunPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GenerationRun" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    RunFile:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, projectId, title, userId, createdAt, lastMessageAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: [string, "null"] }
        userId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: [string, "null"], format: date-time }
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    CreateConversation:
      type: object
      additionalProperties: false
      properties:
        title: { type: [string, "null"], maxLength: 255 }
    Message:
      description: The UI's AiMessage, plus the page it was about.
      type: object
      additionalProperties: false
      required: [id, role, text, pageId, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        text: { type: string }
        pageId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Message" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    AssistantTurn:
      type: object
      additionalProperties: false
      required: [message, changeSet, warning]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        changeSet:
          oneOf: [{ $ref: "#/components/schemas/ChangeSet" }, { type: "null" }]
        warning: { type: [string, "null"] }
    ChangeSet:
      type: object
      additionalProperties: false
      required: [id, conversationId, messageId, pageId, status, baseEditRevision, appliedEditRevision, rejectionCode, items, createdAt, decidedAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        status: { type: string, enum: [PROPOSED, APPLIED, DISCARDED, REJECTED] }
        baseEditRevision: { type: integer }
        appliedEditRevision: { type: [integer, "null"] }
        rejectionCode: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            properties:
              order: { type: integer }
              operation: { type: string, enum: [ADD, UPDATE, REMOVE, MOVE] }
              componentId: { type: [string, "null"] }
              componentType: { type: [string, "null"] }
              position: { type: [object, "null"] }
              propsPatch: { type: [object, "null"] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
    ChangeSetPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChangeSet" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    DecideChangeSet:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [APPLIED, DISCARDED] }
  responses:
    BadRequest:
      description: "Invalid input: a malformed id or body, or a query parameter out of range (`urn:webblock:problem:bad-request`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:webblock:problem:bad-request", title: Bad request, status: 400, detail: "prompt: String should have at least 1 character", instance: "/api/ai-codegen/v2/projects/6c17b5d1-a784-4987-89ff-86079305776b/ai-messages", code: BAD_REQUEST }
    Unauthorized:
      description: "No token, or an invalid or expired one (`urn:webblock:problem:unauthorized`, `WWW-Authenticate: Bearer`)."
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ProjectNotFound:
      description: "No such project, or the caller does not manage it (`urn:webblock:problem:not-found`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "No such project or message, or the caller does not manage the project (`urn:webblock:problem:not-found`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ModelReplyUnusable:
      description: |
        The model answered, but its answer couldn't be used, even after the service asked once more by itself: an
        empty reply, no or invalid JSON, a stream error, or the connection dropping twice
        (`urn:webblock:problem:model-reply-unusable`, code `MODEL_REPLY_UNUSABLE`). No `Retry-After`: the client may
        offer Retry at once, sending the same prompt again.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:webblock:problem:model-reply-unusable", title: Bad gateway, status: 502, detail: "WebBlock AI's answer couldn't be used; try again.", instance: "/api/ai-codegen/v2/projects/6c17b5d1-a784-4987-89ff-86079305776b/ai-messages", code: MODEL_REPLY_UNUSABLE, requestId: "9f1c2e3d-4b5a-6c7d-8e9f-0a1b2c3d4e5f" }
    ServiceUnavailable:
      description: |
        A dependency is down, with `Retry-After`: the model (no answer in time, a 4xx, or 429/5xx twice), Keycloak's
        key set, Project or the database (`urn:webblock:problem:service-unavailable`).
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "The change set is no longer PROPOSED, or the page changed since it was proposed (`urn:webblock:problem:conflict`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: "Project refused the page: the website is suspended or deleted, or the result breaks the component rules (`urn:webblock:problem:unprocessable`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
