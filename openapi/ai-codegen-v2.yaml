openapi: 3.1.0
info:
  title: WebBlock AI Codegen API
  version: 2.0.0
  description: |
    OWNED BY ai_codegen. Consumer: the web UI (`webblock-web-ui`, `src/features/editor/api.ts`, `sendAiMessage`).

    Version 2 of AI Codegen's public API (owner's decision of 10 November 2026, COMMON.md section 3):
    - Paths are resources, with no client segment (`ui/`).
    - Bodies are bare camelCase objects (no `{success, data}` envelope) shaped like the UI's types.
    - Lists are `Page<T>` with a zero-based `page`.
    - Errors are RFC 9457 problem details with `type` `urn:webblock:problem:<code>`.

    v1 stays as it is and is deprecated. Each operation names the v1 route it replaces in `x-replaces`.

    The service serves these paths under their full prefix `/api/ai-codegen/v2`, so the gateway forwards them unchanged
    (no prefix strip, unlike v1).

    **Authorization.** Every operation needs a Keycloak access token (`Authorization: Bearer`). The caller is the token's
    `sub`, never an id in the request. A project-scoped call checks on the server that the caller may manage
    `{projectId}` (Project's access check, action `manage_site`, which fails closed). A project the caller does not
    manage answers 404, exactly like an unknown one, so project ids don't leak. The admin role grants nothing here.
x-needs-from-project:
  description: |
    ACCEPTED by project on 10 November 2026, with its additions; the source of truth is now Project's
    `openapi/project-v2.yaml` (`x-internal-routes`). End-to-end test issue 9; UI inventory open question 6.

    The chat (`sendAiMessage`) needs the project's current draft page, and its edit has to reach that draft so the
    editor shows it. Today AI Codegen calls `GET /internal/v1/projects/{id}`, which Project doesn't serve, and it edits
    only its own copy of the page. Proposed Project internal routes:
    - mesh only, never through the gateway;
    - the mesh's workload identity is the gate (caller `ai-codegen`), no token;
    - bodies are bare, errors are problem details as in Project v2.

    The owner check stays where it is: AI Codegen asks `POST /internal/v1/access-checks` (`manage_site`) before
    either call. `userId` in the PUT is for Project's activity log, not for authorization.
  routes:
    - route: GET /internal/v1/projects/{projectId}/page
      callers: [ai-codegen]
      purpose: The page the assistant edits, with the revision its change set is made against.
      answer:
        status: 200
        example: '{"projectId": "6c17b5d1-a784-4987-89ff-86079305776b", "name": "Sok Coffee", "componentCatalogVersion": "1.0.0", "editRevision": 7, "draft": {"root": {"props": {}}, "content": []}}'
        schema:
          type: object
          required: [projectId, name, componentCatalogVersion, editRevision, draft, updatedAt]
          properties:
            projectId: {type: string, format: uuid}
            name: {type: string}
            componentCatalogVersion: {type: string}
            editRevision: {type: integer, minimum: 0, description: "The same revision as the draft's `ETag` in Project v2."}
            draft: {type: object, description: The saved draft as a Puck document (Project v2 `PageData`).}
            updatedAt: {type: string, format: date-time}
            categories:
              type: array
              items: {type: string}
              description: >-
                Catalog 0.3.0 (README "Products to show (data binding)"): the website's product category names, in the
                catalog's order, so AI Codegen can refuse a `category` or `defaultCategory` that is not one of them.
                Additive and optional: a caller treats it as absent until Project sends it. Coordinator's decision of
                15 November 2026.
            goneProductIds:
              type: array
              items: {type: string}
              description: >-
                Catalog 0.3.0 (README "Products to show (data binding)"): the `productIds` held by the draft's
                ProductCards and AllProducts blocks that are not (any longer) products of this website (in its catalog
                and not archived), each once, in document order. AI Codegen gives it to the skills with `categories`
                as `catalog`, for /check's "picked product that no longer exists". Additive and optional, like
                `categories`; both are best-effort: left out when the catalog does not answer.
      errors:
        - "404 PROJECT_NOT_FOUND: no such project, or it is deleted. A suspended project still answers 200."
    - route: PUT /internal/v1/projects/{projectId}/page/draft
      callers: [ai-codegen]
      purpose: |
        Saves the assistant's applied change set as the new draft, only if the draft is still at
        `expectedEditRevision`. Project bumps the revision, as for an owner's save, and records the edit in the project's
        activity (actor `userId`, source AI chat).
      body:
        type: object
        required: [draft, expectedEditRevision, changeSetId, userId]
        properties:
          draft: {type: object, description: The whole new Puck document.}
          expectedEditRevision: {type: integer, minimum: 0}
          changeSetId: {type: string, format: uuid, description: "AI Codegen's change set, for the activity log and for idempotency: the same changeSetId again answers the first save's 200."}
          userId: {type: string, format: uuid, description: The owner who sent the prompt (the token's sub).}
      answer:
        status: 200
        example: '{"editRevision": 8, "updatedAt": "2026-11-10T08:15:10Z"}'
        schema:
          type: object
          required: [editRevision, updatedAt]
          properties:
            editRevision: {type: integer}
            updatedAt: {type: string, format: date-time}
      errors:
        - "404 PROJECT_NOT_FOUND: no such project, or it is deleted."
        - "409 STALE_EDIT_REVISION: the draft is no longer at expectedEditRevision. AI Codegen then rejects its change set, and the chat reply says nothing was changed and why."
        - "409 IDEMPOTENCY_KEY_REUSED: a different body under a changeSetId already used."
        - "400 VALIDATION_FAILED: the body is malformed; or, from catalog 0.3.0, the draft breaks the component catalog, with field codes VALUE_INVALID / PUCK_TREE_INVALID (README \"Refusals in 0.3.0\"). 400 PUCK_TREE_INVALID: a page checked against 0.1.0 or 0.2.0 breaks the component catalog's rules (field errors in errors)."
        - "422 PROJECT_READ_ONLY: the website is suspended or deleted, as for the owner's own save."
servers:
  - url: /api/ai-codegen/v2
security:
  - bearerAuth: []
tags:
  - name: ai-messages
    description: The project's WebBlock AI design assistant chat.
  - name: generation-runs
    description: Code generation runs and their output.
  - name: conversations
    description: Design assistant conversations and their messages.
  - name: change-sets
    description: The page edits the assistant proposes.
paths:
  /projects/{projectId}/ai-messages:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listAiMessages
      tags: [ai-messages]
      summary: The project's AI chat, one page at a time
      description: Every message of the project's design assistant conversation, the owner's prompts and the assistant's replies, oldest first by default.
      x-replaces: "GET /v1/ui/projects/{project_id}/ai/messages"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          description: "`createdAt,asc` (default, oldest first) or `createdAt,desc`."
          schema:
            type: string
            enum: ["createdAt,asc", "createdAt,desc"]
            default: "createdAt,asc"
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMessagePage"
              example:
                items:
                  - { id: "0b7e9c1e-4f43-4c7b-9a51-3f3e4a2b9d10", role: USER, text: "Make the hero dark", createdAt: "2026-11-10T08:15:02Z" }
                  - { id: "6a0f2d44-1c9b-4e5f-8d1e-7b2c3a4d5e6f", role: ASSISTANT, text: "I gave the hero a dark background.", createdAt: "2026-11-10T08:15:09Z" }
                page: 0
                size: 20
                totalItems: 2
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: sendAiMessage
      tags: [ai-messages]
      summary: Ask WebBlock AI to edit the site
      description: |
        Stores the owner's prompt, asks the model, and stores and returns the assistant's reply. The project's
        conversation is created on the first message.

        The edit the assistant proposes is applied to the project's draft page as one change set, against the page's
        current edit revision. The reply says what changed. When no change reaches the page, the reply never
        claims one: it is "Nothing on your page was changed: <why>. You can ask again, or describe the change
        another way." The reasons:
        - the edit is one the page doesn't allow;
        - no edit was proposed;
        - the page changed while the model was answering;
        - the website is suspended;
        - the change couldn't be saved.

        The answer is the assistant's reply, a new message: `201` with `Location` pointing at it. The owner's own
        prompt is the message just before it in the list.

        When the model fails, the prompt stays stored, unanswered, as the conversation's last message. An unusable
        reply is asked once more by the service itself; if it still can't be used, the answer is `502`
        `MODEL_REPLY_UNUSABLE` and the client may offer Retry. Sending the same prompt again (equal once trimmed)
        while it is still the last message answers that stored prompt instead of storing it twice. With `blockRefs`, a
        send is "the same" only when its references (and its `command`) are the same too.

        `blockRefs` (optional, additive) name the blocks the owner pointed at with "@" in the chat. The assistant
        treats them as the target: its change set only touches those blocks, unless the prompt clearly asks for more
        (for example "and add an FAQ after it"). The references are checked against the draft before anything is
        stored or the model is asked: an id that is not on the page, or is on it with another `type`, answers `422`
        `BLOCK_REF_NOT_FOUND` with plain words ("A block you pointed at is no longer on the page. Pick it again with
        @."), and nothing is stored.

        "/" commands (/rewrite, /translate km …) come as `command` {name, args}, naming a pinned WebBlock AI skill
        (assistant/skills-<version>.json): the router picks that skill exactly, and `prompt` keeps the text the owner
        typed, so the history reads naturally. A client skill (/help) is answered by the chat and never sent.
      x-replaces: "POST /v1/ui/projects/{project_id}/ai/messages"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAiMessage"
            example:
              prompt: Improve the layout and colors of our shop homepage
          examples:
            plain:
              value: { prompt: Improve the layout and colors of our shop homepage }
            withBlockRefs:
              value:
                prompt: Make this section friendlier
                blockRefs: [{ id: "FAQ-3f2a9c1e-77d4-4b8a-9e21-5c0d6b1a2f34", type: FAQ }]
      responses:
        "201":
          description: The assistant's reply.
          headers:
            Location:
              description: "`/api/ai-codegen/v2/projects/{projectId}/ai-messages/{id}` of the reply."
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMessage"
              example: { id: "6a0f2d44-1c9b-4e5f-8d1e-7b2c3a4d5e6f", role: ASSISTANT, text: "I gave the hero a dark background.", createdAt: "2026-11-10T08:15:09Z" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "422": { $ref: "#/components/responses/BlockRefNotFound" }
        "502": { $ref: "#/components/responses/ModelReplyUnusable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/ai-messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAiMessage
      tags: [ai-messages]
      summary: One message of the project's AI chat
      description: The target of `Location` after `sendAiMessage`. A message of another project answers 404.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMessage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listGenerationRuns
      tags: [generation-runs]
      summary: The project's generation runs, newest first by default
      description: Each run without its log; read one run for the log.
      x-replaces: "GET /v1/generation-runs"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,desc", "createdAt,asc"], default: "createdAt,desc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationRunPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGenerationRun
      tags: [generation-runs]
      summary: One generation run, with its log
      x-replaces: "GET /v1/generation-runs/{run_id}"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs/{runId}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGenerationRunFiles
      tags: [generation-runs]
      summary: The source the run produced
      description: Every file of the generated site, sorted by path. An empty array when the run produced none.
      x-replaces: "GET /v1/generation-runs/{run_id}/files"
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/generation-runs/{runId}/check-report:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGenerationRunCheckReport
      tags: [generation-runs]
      summary: The run's check report
      description: The report as the run stored it (`summary`, `changed_files` and the checks). 404 while the run has none.
      x-replaces: "GET /v1/generation-runs/{run_id}/check-report"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listConversations
      tags: [conversations]
      summary: The project's design assistant conversations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,desc", "createdAt,asc"], default: "createdAt,desc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a conversation
      description: Owned by the caller (the token's `sub`). Answers 201 with `Location`.
      x-replaces: ["POST /v1/projects/{project_id}/conversations", "POST /v1/conversations"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversation" }
      responses:
        "201":
          description: The new conversation.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConversation
      tags: [conversations]
      summary: One conversation
      description: Its messages and change sets are the two lists below it (v1 embedded them).
      x-replaces: "GET /v1/conversations/{conversation_id}"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: The conversation's messages, oldest first by default
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,asc", "createdAt,desc"], default: "createdAt,asc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: sendConversationMessage
      tags: [conversations]
      summary: Ask the assistant
      description: |
        Stores the prompt, asks the model about the project's current draft, and answers 201 with the reply, the change
        set it proposes and a warning when its proposal was invalid (then no change set). The change set is only
        proposed: PATCH it to apply it. `Location` is the reply. Model failures, the stored prompt and Retry are as for
        `POST /projects/{projectId}/ai-messages`, and so are `blockRefs` and their 422.
      x-replaces: "POST /v1/conversations/{conversation_id}/messages"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendAiMessage" }
      responses:
        "201":
          description: The assistant's turn.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTurn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BlockRefNotFound" }
        "502": { $ref: "#/components/responses/ModelReplyUnusable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConversationMessage
      tags: [conversations]
      summary: One message
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/conversations/{conversationId}/change-sets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listConversationChangeSets
      tags: [change-sets]
      summary: The change sets the assistant proposed in this conversation
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: sort
          in: query
          schema: { type: string, enum: ["createdAt,asc", "createdAt,desc"], default: "createdAt,asc" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /projects/{projectId}/change-sets/{changeSetId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - { name: changeSetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getChangeSet
      tags: [change-sets]
      summary: One change set
      x-replaces: "GET /v1/change-sets/{change_set_id}"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: decideChangeSet
      tags: [change-sets]
      summary: Apply or discard a proposed change set
      description: |
        `APPLIED` saves it as the project's draft through Project (`PUT /internal/v1/projects/{id}/page/draft`) and
        answers the change set with `appliedEditRevision`; `DISCARDED` drops it. 409 when it is no longer `PROPOSED` or
        the page changed since it was proposed (`rejectionCode` `STALE_EDIT_REVISION`); 422 when Project refuses the
        page (`PROJECT_READ_ONLY`, `PUCK_TREE_INVALID`); 503 when Project is down (it stays `PROPOSED`, retry).
        From catalog 0.3.0 Project refuses a page that breaks the catalog with 400 `VALIDATION_FAILED` whose field
        errors carry the codes `VALUE_INVALID` / `PUCK_TREE_INVALID` (README "Refusals in 0.3.0"); the change set then
        still stores `rejectionCode` `PUCK_TREE_INVALID` (422) and the chat replies as for a catalog refusal. When the
        refusal names `root.facebookUrl` or `root.instagramUrl` (a stored WhatsApp address, or one whose host readers
        could read differently: README "No WhatsApp"), the chat reply tells the owner to change that link in the
        editor's page settings: until then no change set saves, whatever it changes.
      x-replaces: "PATCH /v1/change-sets/{change_set_id}"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideChangeSet" }
      responses:
        "200":
          description: The decided change set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token of the WebBlock realm.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    AiMessage:
      description: "One message of the WebBlock AI chat: the UI's `AiMessage` (`src/features/editor/types.ts`)."
      type: object
      additionalProperties: false
      required: [id, role, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        text: { type: string }
        createdAt: { type: string, format: date-time, description: ISO 8601 in UTC, with `Z`. }
        blockRefs:
          description: |
            Additive. Only on a USER message sent with `blockRefs`, as sent (the chat history shows them as chips);
            absent otherwise. The block may have left the page since: a client shows it by its `type`.
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/BlockRef" }
        skill:
          description: |
            Additive. Only on an ASSISTANT reply that used a skill: the skill that shaped it (the UI shows "Used:
            <title>", with the skill's `summary` as a tooltip from the pinned skill list). Absent otherwise.
          type: object
          additionalProperties: false
          required: [name, title]
          properties:
            name: { type: string, description: The skill file's `name`, e.g. `shorten`. }
            title: { type: string, description: "The skill shown to the owner, e.g. `Copywriting`." }
        changeSet:
          description: |
            Additive (W11.4, owner decision of 15 November 2026: keep "what WebBlock AI changed" in the history). Only
            on an ASSISTANT reply whose change set reached the page (status APPLIED): the change set AI Codegen
            applied to the draft for this reply, so the chat lists what changed under every reply, also after a
            reload. Absent on USER messages, on a reply that changed nothing ("Nothing on your page was changed: …"),
            and on a reply whose change set was not applied. The same on sendAiMessage's 201 and on listAiMessages.
            Replies applied before W11.4 carry it too, without `previous` (their old values were not recorded).
            A client lists the rows; the blocks may have left the page since (it then shows a row by
            `componentType`). Undo is not offered from the history: only the editor that made the change, while it
            is still the latest one, offers it.
          allOf: [{ $ref: "#/components/schemas/AppliedChangeSet" }]
        clarification:
          description: |
            Additive (brief BRIEF-ai-chat-clarification-2026-11-20: "the chat should ask for clarification if unclear
            before doing the change"). Only on an ASSISTANT reply that asks instead of changing the page; absent
            otherwise. `text` is the same question, so a client that doesn't know this field still shows it. No
            change set is stored for a reply that asks (no `changeSet`). Kept in the history: a client offers the
            options only while the message is the conversation's latest.

            The owner answers with sendAiMessage: an option's `label` as `prompt` and its `blockRefs` (left out when
            it has none), or any typed text. The next USER message after a question answers it; at most two
            questions about one request, then the reply suggests pointing at the block with "@". The same in the
            streamed `final` event: `final.message.clarification`, and `final.clarification` beside `applied`.
          allOf: [{ $ref: "#/components/schemas/AiClarification" }]
    AiClarification:
      description: |
        A question instead of a change. `CHOOSE`: more than one block fits the request, so the owner picks (the
        model's question). `CONFIRM`: the change reaches further than asked (a button's colour is shared by every
        button), so the owner confirms; `YES` applies it as proposed, `NO` changes nothing. The question and the
        labels describe blocks the way the owner sees them (their text, colour and place on the page), never by
        internal names (hero, CTA, root, block types).
      type: object
      additionalProperties: false
      required: [kind, question, round, options]
      properties:
        kind: { type: string, enum: [CHOOSE, CONFIRM] }
        question: { type: string, minLength: 1, maxLength: 300 }
        round: { type: integer, minimum: 1, maximum: 2, description: The question's round about this request. }
        options:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: "#/components/schemas/AiClarificationOption" }
    AiClarificationOption:
      description: |
        One answer. `PICK`: these blocks (`blockRefs`, 1 to 5). `ALL`: "Both" or "All" (`blockRefs` lists them when
        there are at most 5; absent means every block that fits). `YES` and `NO`: a CONFIRM's answers, without
        `blockRefs`. A client sends `label` as the prompt with the option's `blockRefs`; hovering an option may
        highlight its blocks in the preview.
      type: object
      additionalProperties: false
      required: [label, action]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        action: { type: string, enum: [PICK, ALL, "YES", "NO"] }  # quoted: YAML 1.1 reads YES and NO as booleans
        blockRefs:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/BlockRef" }
    AppliedChangeSet:
      description: |
        A change set as AI Codegen applied it to the page's draft (W11.4): its items in the order they were applied,
        and the draft's edit revisions before and after. Read-only history: it says what changed, it never changes
        anything.
      type: object
      additionalProperties: false
      required: [id, baseEditRevision, appliedEditRevision, items]
      properties:
        id: { type: string, format: uuid, description: "The change set's id (ChangeSet.id)." }
        baseEditRevision:
          type: integer
          minimum: 0
          description: The draft's edit revision the change set was applied against.
        appliedEditRevision:
          type: integer
          minimum: 1
          description: The draft's edit revision the save produced. While the page is still at it, this was the latest change.
        items:
          description: |
            At most 100: AI Codegen refuses a proposed change set of more than 100 operations as an invalid proposal
            (the reply says nothing on the page was changed).
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AppliedChange" }
    AppliedChange:
      description: |
        One applied operation. `componentId` is the block's `props.id`, or `root` for the page's own settings
        (root.props, an UPDATE only, `componentType` null). `position` is where the block actually went (ADD,
        MOVE): AI Codegen stores the effective position at apply time (an index past the end lands at the end, and
        is stored as the index it got), on ChangeSet.items too. `position` and `previous.position` have the change
        set's shape, `ChangeItemPosition` `{parentId, slot, index}`: `{index}` alone is a top-level position, as every
        position stored before catalog 0.3.0 is, so those rows read the same. Since catalog 0.3.0 (DRAFT) a position
        may name a container's slot. REMOVE's `previous.props` of a container includes its slot lists, so the removed
        subtree stays in the history.
      type: object
      additionalProperties: false
      required: [order, operation, componentId, componentType]
      properties:
        order: { type: integer, minimum: 1, description: "ChangeSet.items' `order`: 1-based, in apply order." }
        operation: { type: string, enum: [ADD, UPDATE, REMOVE, MOVE] }
        componentId: { type: string, minLength: 1, maxLength: 100 }
        componentType:
          type: [string, "null"]
          maxLength: 40
          description: The block's catalog type; null only for `root`.
        position:
          description: "ADD and MOVE: where the block went. Null otherwise."
          oneOf: [{ $ref: "#/components/schemas/ChangeItemPosition" }, { type: "null" }]
        propsPatch:
          type: [object, "null"]
          description: |
            ADD: the new block's props, without `id` (that is `componentId`). UPDATE: the new values of exactly the
            props it changed (a list prop is its whole new list); a prop whose value didn't change is never in it
            (dropped when the change is proposed). Null for REMOVE and MOVE.
        previous:
          description: |
            Optional: the values before this operation, as AI Codegen read them from the draft it applied the change
            set to, so the chat can show before and after. UPDATE: `props` with the same keys as `propsPatch` and
            their old values (null for a prop the block didn't have). REMOVE: `props` (the removed block's props) and
            `position` (where it was). MOVE: `position` (where it was). ADD: absent. Absent too on changes applied
            before W11.4.
          type: object
          additionalProperties: false
          properties:
            props: { type: object }
            position:
              description: "REMOVE and MOVE: where the block was, before this operation."
              allOf: [{ $ref: "#/components/schemas/ChangeItemPosition" }]
    BlockRef:
      description: |
        One block of the page's draft, as the editor's Puck data holds it: `props.id` and the block `type` (a block
        type of the editor catalog, puck/catalog-<version>.json). Since catalog 0.3.0 (DRAFT) the block may sit at any
        depth, inside a container's slot.
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z]+$" }
    AiMessagePage:
      description: "`Page<AiMessage>` (`src/lib/api/types.ts`)."
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AiMessage" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    SendAiMessage:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000, description: What the owner wants changed. }
        pageId:
          type: [string, "null"]
          format: uuid
          description: The page to edit. Absent or null means the home page. The UI doesn't send it today.
        blockRefs:
          description: |
            Additive, optional. The blocks the owner pointed at with "@", at most 5, distinct ids (a repeated id is
            400). Absent or empty: the whole page, as before. See sendAiMessage for how they steer the edit and the
            422 for a stale one.
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/BlockRef" }
        command:
          description: |
            Additive, optional. The "/" command the owner picked (WebBlock AI skills, assistant/skills-<version>.json):
            `name` is a pinned skill's `name` (for example `translate`), `args` what followed it (`km`). The router uses
            it to pick the skill exactly, never parsed from the text; `prompt` still carries the readable request so the
            history reads naturally. A name AI Codegen doesn't pin is 400. A `client` skill (`help`) is never sent.
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, pattern: "^[a-z][a-z0-9-]{0,29}$" }
            args: { type: string, maxLength: 200 }
    Problem:
      description: RFC 9457 problem details. The UI shows `title` and `detail` and branches on `status`.
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: "`urn:webblock:problem:<code>`, for example `urn:webblock:problem:not-found`."
        title: { type: string, description: A short summary of the problem type. }
        status: { type: integer }
        detail: { type: string, description: What went wrong this time. It never echoes the request or a token. }
        instance: { type: string, description: The request path. }
        code: { type: string, description: "The code of `type` in UPPER_SNAKE, for example `NOT_FOUND`." }
        requestId: { type: string, description: The caller's `X-Request-Id`, or a new one. }
    GenerationRun:
      type: object
      required: [id, projectId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        generationRequestId: { type: [string, "null"], format: uuid }
        flow: { type: string, enum: [INITIAL_GENERATION, EXISTING_APP_UPDATE] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        step: { type: [string, "null"], description: "The pipeline step the run is at (PREPARE, AI_CODE_UPDATE, BUILD, GITHUB_PUSH, DEPLOY), or DONE." }
        attempt: { type: integer }
        strategy: { type: [string, "null"] }
        modelName: { type: [string, "null"] }
        inputTokens: { type: [integer, "null"] }
        outputTokens: { type: [integer, "null"] }
        errorCode: { type: [string, "null"] }
        errors: { type: [string, "null"] }
        commitSha: { type: [string, "null"] }
        promoted: { type: boolean, description: The request accepted this run's result. }
        repositoryUrl: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        changedFiles: { type: array, items: { type: string } }
        validations: { type: array, items: { $ref: "#/components/schemas/Validation" } }
        deployment:
          oneOf: [{ $ref: "#/components/schemas/Deployment" }, { type: "null" }]
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        log: { type: string, description: Only on getGenerationRun. }
    Validation:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        attempt: { type: integer }
        required: { type: boolean }
        status: { type: string, enum: [RUNNING, PASSED, FAILED, SKIPPED] }
        error: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    Deployment:
      type: object
      properties:
        releaseId: { type: string, format: uuid }
        status: { type: [string, "null"] }
        deployStatus: { type: [string, "null"] }
        hostingStatus: { type: [string, "null"] }
        live: { type: boolean }
        failureCode: { type: [string, "null"] }
        failureSummary: { type: [string, "null"] }
        promotedAt: { type: [string, "null"], format: date-time }
    GenerationRunPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GenerationRun" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    RunFile:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, projectId, title, userId, createdAt, lastMessageAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: [string, "null"] }
        userId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: [string, "null"], format: date-time }
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    CreateConversation:
      type: object
      additionalProperties: false
      properties:
        title: { type: [string, "null"], maxLength: 255 }
    Message:
      description: The UI's AiMessage, plus the page it was about.
      type: object
      additionalProperties: false
      required: [id, role, text, pageId, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        text: { type: string }
        pageId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        clarification:
          description: |
            Additive. As AiMessage.clarification: only on an ASSISTANT reply that asks instead of changing the page.
            On this route the model's questions only (CHOOSE): its change sets are proposed, so applying one is the
            confirmation and no CONFIRM is asked here. An answer to a CONFIRM asked on sendAiMessage is accepted here
            too, when that question is still the latest message of this conversation (an older chat resumed): `YES`
            returns the held change set PROPOSED, made against the draft's edit revision when the question was asked
            (PATCH it to apply; 409 when the page changed since), `NO` changes nothing; neither asks the model, and
            the same answer again straight after changes nothing more. Send such an answer here, never through
            sendAiMessage, which always uses the project's newest conversation.
          allOf: [{ $ref: "#/components/schemas/AiClarification" }]
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Message" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    AssistantTurn:
      type: object
      additionalProperties: false
      required: [message, changeSet, warning]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        changeSet:
          oneOf: [{ $ref: "#/components/schemas/ChangeSet" }, { type: "null" }]
        warning: { type: [string, "null"] }
    ChangeSet:
      type: object
      additionalProperties: false
      required: [id, conversationId, messageId, pageId, status, baseEditRevision, appliedEditRevision, rejectionCode, items, createdAt, decidedAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        status: { type: string, enum: [PROPOSED, APPLIED, DISCARDED, REJECTED] }
        baseEditRevision: { type: integer }
        appliedEditRevision: { type: [integer, "null"] }
        rejectionCode: { type: [string, "null"] }
        items:
          type: array
          description: |
            The operations, applied in `order`. Catalog 0.3.0 additions (DRAFT, proposed by webui; ai_codegen agrees,
            with its changes of 15 November folded in; additive, so a 0.2.0 change set reads the same):
            - `componentId` names a block at any depth: block ids are unique across the whole tree (catalog
              `page.uniqueBlockIds`), slots included. The same holds for the "@" `BlockRef` ids.
            - ADD and MOVE carry a `ChangeItemPosition`. A position with only `index` is the top level, as before.
            - Each item is checked structurally as it is applied: the parent exists, `slot` is one of the parent's
              catalog `slots`, and `index` is at most the target list's length.
            - The catalog's rules are checked once, on the FINAL tree of the change set, not after each item:
              `allow`/`disallow`, `activeWhen`, `minItems`/`maxItems`, `page.maxDepth`, `topLevelOnly`, both budgets,
              unique ids and anchors (and every value rule). A change set that breaks one is refused whole. So a wrap
              at the top-level limit works: ADD the Section, then MOVE the blocks into it.
            - Slot props are never in an UPDATE's `propsPatch`: a container's children change only through ADD, MOVE
              and REMOVE. On ADD, a slot key may only be `[]` (as the catalog's `addDefaults` have it).
            - MOVE's `index` counts in the target list after the block has been taken out of its old place, as the
              top-level MOVE does today. A MOVE into the moved block's own subtree is refused.
            - An ADD without an `index` goes at the end of its list, as today.
            - An UPDATE that turns off a Columns slot still holding blocks (a three-part `ratio` changed to a two-part
              one with `column3` filled) fails the final-tree check (`activeWhen`): MOVE or REMOVE those blocks first.
            - REMOVE of a container removes its whole subtree.
            - There is no WRAP or UNWRAP: wrapping blocks in a Section or Columns is an ADD of the container followed by
              MOVEs into its slot; unwrapping is MOVEs out of it, then a REMOVE of the container.
            - Positions here always carry real block ids. The model may name a container it adds in the same change set
              by a `ref` (README "Editor component catalog", 0.3.0's AI policy); AI Codegen generates the ADD's id when
              the change is proposed and resolves every ref then, so a stored or returned change set never holds one.
          items:
            type: object
            properties:
              order: { type: integer }
              operation: { type: string, enum: [ADD, UPDATE, REMOVE, MOVE] }
              componentId: { type: [string, "null"] }
              componentType: { type: [string, "null"] }
              position:
                oneOf: [{ $ref: "#/components/schemas/ChangeItemPosition" }, { type: "null" }]
              propsPatch: { type: [object, "null"] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
    ChangeItemPosition:
      description: |
        DRAFT (catalog 0.3.0), proposed by webui, accepted by ai_codegen with its changes of 15 November. Where an ADD
        puts its block, or a MOVE moves one: the parent (null for the page's own content list, the top level), the
        parent's slot, and the index in it. Additive: `{index}` alone is still a top-level position, as in catalog
        0.1.0 and 0.2.0. The same shape is AppliedChange's `position` and `previous.position` (W11.4).
      type: object
      additionalProperties: false
      properties:
        parentId:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
          description: |
            The container's block id (catalog `page.blockId`): always a real id here, never a model-side ref. Null or
            absent: the top level.
        slot:
          type: [string, "null"]
          maxLength: 40
          description: |
            A key of the parent's catalog `slots` (e.g. `content`, `column2`). Null or absent exactly when parentId is.
        index:
          type: integer
          minimum: 0
          description: |
            Position in the target list, 0 first, at most its length. For a MOVE it counts in the target list after the
            block has been taken out of its old place. An ADD without it goes at the end of the list.
    ChangeSetPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChangeSet" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    DecideChangeSet:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [APPLIED, DISCARDED] }
  responses:
    BadRequest:
      description: "Invalid input: a malformed id or body, or a query parameter out of range (`urn:webblock:problem:bad-request`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:webblock:problem:bad-request", title: Bad request, status: 400, detail: "prompt: String should have at least 1 character", instance: "/api/ai-codegen/v2/projects/6c17b5d1-a784-4987-89ff-86079305776b/ai-messages", code: BAD_REQUEST }
    Unauthorized:
      description: "No token, or an invalid or expired one (`urn:webblock:problem:unauthorized`, `WWW-Authenticate: Bearer`)."
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ProjectNotFound:
      description: "No such project, or the caller does not manage it (`urn:webblock:problem:not-found`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "No such project or message, or the caller does not manage the project (`urn:webblock:problem:not-found`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ModelReplyUnusable:
      description: |
        The model answered, but its answer couldn't be used, even after the service asked once more by itself: an
        empty reply, no or invalid JSON, a stream error, or the connection dropping twice
        (`urn:webblock:problem:model-reply-unusable`, code `MODEL_REPLY_UNUSABLE`). No `Retry-After`: the client may
        offer Retry at once, sending the same prompt again.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:webblock:problem:model-reply-unusable", title: Bad gateway, status: 502, detail: "WebBlock AI's answer couldn't be used; try again.", instance: "/api/ai-codegen/v2/projects/6c17b5d1-a784-4987-89ff-86079305776b/ai-messages", code: MODEL_REPLY_UNUSABLE, requestId: "9f1c2e3d-4b5a-6c7d-8e9f-0a1b2c3d4e5f" }
    BlockRefNotFound:
      description: |
        A `blockRefs` entry is not on the draft page (its id is gone, or the id now has another type)
        (`urn:webblock:problem:block-ref-not-found`, code `BLOCK_REF_NOT_FOUND`). Nothing was stored and the model was
        not asked; the client asks the owner to pick the block again.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:webblock:problem:block-ref-not-found", title: Unprocessable content, status: 422, detail: "A block you pointed at is no longer on the page. Pick it again with @.", instance: "/api/ai-codegen/v2/projects/6c17b5d1-a784-4987-89ff-86079305776b/ai-messages", code: BLOCK_REF_NOT_FOUND, requestId: "9f1c2e3d-4b5a-6c7d-8e9f-0a1b2c3d4e5f" }
    ServiceUnavailable:
      description: |
        A dependency is down, with `Retry-After`: the model (no answer in time, a 4xx, or 429/5xx twice), Keycloak's
        key set, Project or the database (`urn:webblock:problem:service-unavailable`).
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "The change set is no longer PROPOSED, or the page changed since it was proposed (`urn:webblock:problem:conflict`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: "Project refused the page: the website is suspended or deleted, or the result breaks the component rules (`urn:webblock:problem:unprocessable`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
