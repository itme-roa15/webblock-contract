  /projects/{projectId}/page:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [page]
      operationId: getPageData
      summary: The saved draft and the published page (editor).
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/projects/{projectId}/page", "GET /api/v1/projects/{projectId}/page"]
      responses:
        '200':
          description: The page. `ETag` carries the edit revision the next save sends in `If-Match`.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebsitePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [page]
      operationId: savePageData
      summary: Saves the draft (visitors still see the published page).
      description: |
        Optimistic locking through `If-Match` with the `ETag` of the last read (or of the last save). Without
        `If-Match` the save is taken as is (last write wins): the UI's `savePageData` sends no revision, and AI
        Codegen's chat edits arrive through Project's internal route with their own revision. A stale `If-Match`
        answers 412. `expectedEditRevision` in the body is accepted as an alternative to `If-Match`.

        Catalog 0.3.0 (DRAFT; README "Editor component catalog", 0.3.0, "Refusals in 0.3.0" and "Products to show
        (data binding)", decided 15 November 2026): a page checked against 0.3.0 is refused with 400 VALIDATION_FAILED,
        and every `errors` entry is spelled one way. `field` is `content[i].<Type>.<prop>` for a top-level block and
        `content[i].<Type>.<slot>[j].<Type>.<prop>` for a nested one (one `.<slot>[j].<Type>` per level), with a list
        item's index after its prop, e.g. `content[2].Columns.column1[0].Buttons.items[1].link` for a WhatsApp link;
        `root.<prop>` for the page's settings. `code` is `VALUE_INVALID` for a value (schema keyword, pattern, rich
        text rule, required alt, link rule or blocked host, a product that is not this website's) and
        `PUCK_TREE_INVALID` for the structure (depth, slot rules, `topLevelOnly` and the Footer last, budgets, repeated
        block ids, `zones`), naming the block or slot the same way. Without a single prop: a rich text rule names
        `content[i].RichText.body` (or its nested path); a budget names `content`; `maxPerPage` names the first block
        of that type over the limit; a repeated block id the second block holding it, with `.id`; a repeated or
        reserved anchor the Section's `anchorId` (the second, when repeated); `zones` is `zones` ("first" and "second"
        in document order: depth first, a container before its slots). Since 0.3.0 `root.facebookUrl` and
        `root.instagramUrl` take no blocked host either, nor an authority holding `@`, `%`, a backslash or a non-ASCII
        character (README "No WhatsApp", the social links' host rule; `root.facebookUrl`, `VALUE_INVALID`).

        ProductCards and AllProducts name the products they show in `productIds`. An entry that is not a product of
        this website (one its product routes answer for it: in its catalog, not archived) is field
        `content[i].<Type>.productIds[j]`, code `VALUE_INVALID`, for example `content[3].ProductCards.productIds[1]`.
        An unknown id and another website's product get the same answer. Only ids that no product block of the stored
        draft already holds are checked, so a product deleted since never blocks a save; a restore checks none. An
        unknown `category` or `defaultCategory` is only logged. The internal draft save
        (`PUT /internal/v1/projects/{projectId}/page/draft`) answers the same.
      x-phase: 2
      x-replaces: ["PUT /api/v1/ui/projects/{projectId}/page", "PUT /api/v1/projects/{projectId}/page"]
      parameters:
        - name: If-Match
          in: header
          schema: {type: string, examples: ['"7"']}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: {$ref: '#/components/schemas/PageData'}
                expectedEditRevision: {type: integer, minimum: 0}
                componentCatalogVersion:
                  type: string
                  examples: ['0.2.0']
                  description: |
                    Optional (catalog 0.2.0). Clients send it only once Project accepts it (README "Editor component
                    catalog", Rollout order). The editor catalog (puck/catalog-<version>.json) the client
                    built `data` with. Absent: the page is checked against the project's stored version, as before.
                    Present: checked against this version, then stored as the project's version (README "Editor
                    component catalog", Versions). A version Project doesn't pin, or one older than the stored, is
                    400 VALIDATION_FAILED (field `componentCatalogVersion`).
      responses:
        '200':
          description: Saved. `ETag` is the new edit revision.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebsitePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    patch:
      tags: [page]
      operationId: restoreVersion
      summary: Puts an old deployed version back live; the draft is reset to it.
      description: |
        The draft is reset to the version (as v1's restore), `If-Match` as on PUT, and the answer is 200 with the page.
        Provisioning cannot put a replaced release live again (a superseded release is final), so the restored version
        goes live with the owner's next deploy (a new publish). Raised to the owner as a product point by Provisioning.
      x-phase: 3
      x-replaces: ["POST /api/v1/ui/projects/{projectId}/page/versions/{versionId}/restore"]
      parameters:
        - name: If-Match
          in: header
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [currentVersionId]
              additionalProperties: false
              properties:
                currentVersionId: {type: string, format: uuid}
      responses:
        '200':
          description: The page after the restore.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebsitePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
