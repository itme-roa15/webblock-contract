openapi: 3.1.0
info:
  title: WebBlock Project API v2
  version: 2.0.0-draft.1
  description: |
    OWNED BY project. DRAFT, proposed by project, waits for the UI agent and the gateway (infra agent).

    The public API of the Project service: websites, their page, products, business details, media, deployments,
    the template gallery and the admin website reads. Replaces the `/api/v1/ui/...` routes and the older
    `/api/v1/...` routes of Project with one route per resource (owner decision of 10 November 2026). v1 stays as it
    is and is marked deprecated.

    Rules (COMMON.md section 3):
    - Base path `/api/project/v2`. The gateway routes it to Project unchanged (Project's controllers carry the full path).
    - No envelope. A list whose UI type is `Page<T>` answers `{items, page, size, totalItems}` (page zero-based) and
      takes `?page=&size=&sort=field,asc|desc`. A small fixed list whose UI type is an array answers a bare array.
    - Errors are RFC 9457 problem details (`application/problem+json`): `type` = `urn:webblock:problem:<code>`,
      `title`, `status`, `instance`, plus `code`, `requestId` and `errors` (field errors). `detail` is a fixed,
      server-written sentence when there is one; a body never echoes what the caller sent.
    - Ids are UUID strings, except template ids, which are template codes. Times are ISO 8601 in UTC. Field names
      are camelCase, spelled as in the UI's types (`webblock-web-ui/src/features/*/types.ts`). `websiteId` in a body
      is the project id.
    - Auth: a Keycloak bearer JWT (audience `project`, user id from the `user_id` claim). `owner` = the caller must own
      `{projectId}`, else 404 (ids never leak; a body id never proves ownership). `admin` = top-level `roles` claim
      holds `ADMIN`, else 403. `public` = no token needed (a token, if sent, is ignored).
    - `x-replaces` names the v1 route(s) an operation replaces. `x-phase` says when it is built: `2` = v2 of an
      existing v1 behaviour, `3` = new behaviour or needs another service. `x-status: waits-for-owner` = drafted only.
x-consumes:
  description: |
    Events of other services Project consumes on its own queues (Project declares only `project.*` names and binds
    them to the producer's exchange; each queue is a quorum queue with a delivery limit and its own `.dlq`).
  events:
    - event: provisioning.publish_failed.v1
      schema: events/provisioning/publish_failed.v1.schema.json (OWNED BY provisioning)
      status: ACCEPTED by provisioning (agent 2efb67d2, 11 November 2026); owner decision Q6
      queue: project.publish_failed.v1 (+ project.publish_failed.v1.dlq) on provisioning.events, routing key publish_failed.v1
      effect: |
        One deploy activity that failed ("Deploy failed", detail "Reason code: <failure_code>"), and the release's
        generation given back to the owner's plan through Project's outbox: findRelease
        (`GET /internal/v1/projects/{projectId}/releases?releaseId=`, provisioning-internal-v1.yaml) names the
        generation request, then Payment's `DELETE /internal/v1/generation-admissions/{generationRequestId}`
        (204 and 404 end it; anything else retries with a WARN, and spent retries end with an ERROR). A repeat of the
        message (message_id) or of the fact (event_key `publish-failed-<release_id>`) records and gives back nothing
        more. An unknown project is recorded as unknown_project with no effect; a body that breaks the schema goes to
        the dead-letter queue. The website's status does not change; the deployment reads FAILED from the release.

x-internal-routes:
  description: |
    Project's service-to-service routes (mesh only, never through the gateway; the mesh's workload identity is the
    gate, no token). They live outside `/api/project/v2`, so they are listed here and not under `paths`. Bodies are
    bare (no envelope), errors are problem details as in v2.
  routes:
    - route: GET /internal/v1/owners/website-counts
      x-phase: 2
      callers: [user-service]
      purpose: UserAccount.websiteCount and the Websites column of the admin user CSV (one admin-list page).
      query:
        ownerId:
          description: An owner (user) id. Repeat it, 1 to 100 distinct values (a repeated value counts once).
          type: string
          format: uuid
          required: true
          repeated: true
      answer:
        status: 200
        description: |
          One row per distinct asked owner, in the order first asked, `websiteCount` 0 for an owner without websites.
          Counts the owner's websites that are not deleted, in any status (DRAFT, LIVE, SUSPENDED).
        example: '[{"ownerId": "0199e0a2-0000-7000-8000-0000000000aa", "websiteCount": 2}]'
        schema:
          type: array
          items:
            type: object
            required: [ownerId, websiteCount]
            properties:
              ownerId: {type: string, format: uuid}
              websiteCount: {type: integer, minimum: 0}
      errors:
        - '400 VALIDATION_FAILED: no ownerId, more than 100 distinct ids, or an id that is not a UUID (field `ownerId`).'
      timeout: "The caller's (User: 2 s, a failure is shown as null). Project answers from one indexed query."

    - route: GET /internal/v1/projects
      x-phase: 3
      status: ACCEPTED by payment (agent 76e8d818, 10 November 2026); also for provisioning; also for notification (agent d74127bc, 11 November 2026)
      callers: [payment-service, provisioning-service, notification-service]
      purpose: Website name, domain and image on orders, receipts and admin subscriptions; productCount for usage meters; the website's owner (ownerId, name) for Notification's owner notifications.
      query:
        id:
          description: A project id. Repeat it, 1 to 100 distinct values (a repeated value counts once).
          type: string
          format: uuid
          required: true
          repeated: true
      answer:
        status: 200
        description: A bare array in the order first asked. Unknown and deleted projects are left out.
        schema:
          type: array
          items:
            type: object
            required: [projectId, ownerId, name, domain, imageUrl, logoUrl, templateSlug, productCount, status, photoCount]
            properties:
              projectId: {type: string, format: uuid}
              ownerId: {type: string, format: uuid}
              name: {type: string}
              domain: {type: [string, 'null'], description: The public host; null until the website has one.}
              imageUrl: {type: [string, 'null'], description: The template's thumbnail.}
              logoUrl: {type: [string, 'null'], description: The business logo.}
              templateSlug: {type: string}
              productCount: {type: [integer, 'null'], description: The website's catalog products; null when the catalog cannot be read.}
              status: {type: string, enum: [DRAFT, LIVE, SUSPENDED]}
              photoCount:
                type: integer
                minimum: 0
                description: |
                  The website's photos: the rows of its media library the owner uploaded (`origin` UPLOAD, every PNG
                  or JPEG uploaded, used or not; TEMPLATE copies never count, W8, owner decision of 15 November 2026);
                  a file deleted through deleteMedia leaves the count at once. Payment's "Photos" meter (payment agent
                  76e8d818 agreed, 14 November 2026).
      errors:
        - '400 VALIDATION_FAILED: no id, more than 100 distinct ids, or an id that is not a UUID (field `id`).'
    - route: GET /internal/v1/generation-requests/latest
      x-phase: 3
      status: ACCEPTED by provisioning (agent 2efb67d2, 11 November 2026; the status set and the fields)
      callers: [provisioning-service]
      purpose: Provisioning's admin pipeline view, each website's newest generation request (the step before a release).
      query:
        projectId:
          description: A project id. Repeat it, 1 to 100 distinct values (a repeated value counts once).
          type: string
          format: uuid
          required: true
          repeated: true
      answer:
        status: 200
        description: |
          A bare array in the order first asked: each project's newest generation request (by createdAt, then id).
          A project without one, or an unknown id, is left out. `status` is QUEUED (captured, waiting for admission),
          GENERATING, PUBLISHING (pushing the source), PUBLISHED or FAILED. `gitCommitSha` is set once the source is
          pushed; `failureReason` is the stored failure code of a FAILED request (null otherwise). Deleted websites
          keep their requests and are answered too.
        example: '[{"projectId": "0199e0a2-0000-7000-8000-0000000000aa", "generationRequestId": "0199e0a2-0000-7000-8000-0000000000bb", "status": "PUBLISHED", "createdAt": "2026-11-11T09:00:00Z", "updatedAt": "2026-11-11T09:04:00Z", "gitCommitSha": "abababababababababababababababababababab", "failureReason": null}]'
        schema:
          type: array
          items:
            type: object
            required: [projectId, generationRequestId, status, createdAt, updatedAt]
            properties:
              projectId: {type: string, format: uuid}
              generationRequestId: {type: string, format: uuid}
              status: {type: string, enum: [QUEUED, GENERATING, PUBLISHING, PUBLISHED, FAILED]}
              createdAt: {type: string, format: date-time}
              updatedAt: {type: string, format: date-time}
              gitCommitSha: {type: string, nullable: true}
              failureReason: {type: string, nullable: true}
      errors:
        - '400 VALIDATION_FAILED: no projectId, more than 100 distinct ids, or an id that is not a UUID (field `projectId`).'
      timeout: "The caller's. Project answers from one query, per project through the (project_id, idempotency_key) index."

    - route: GET /internal/v1/projects/{projectId}/page
      x-phase: 3
      status: ACCEPTED by ai_codegen (agent 4c7a416d, its openapi/ai-codegen-v2.yaml x-needs-from-project, 10 November 2026)
      callers: [ai-codegen-service]
      purpose: The AI chat reads the website's draft and its edit revision before a change set (issue 9, UI question 6).
      answer:
        status: 200
        schema:
          type: object
          required: [projectId, name, componentCatalogVersion, editRevision, draft, updatedAt]
          properties:
            projectId: {type: string, format: uuid}
            name: {type: string}
            componentCatalogVersion: {type: string}
            editRevision: {type: integer, description: The revision v2's page ETag carries.}
            draft: {type: object, description: The Puck document of the home page (v2 PageData).}
            updatedAt: {type: string, format: date-time}
            categories:
              type: array
              items: {type: string}
              description: >-
                Catalog 0.3.0 (README "Products to show (data binding)"): the website's product category names, in the
                catalog's order, so AI Codegen can refuse a `category` or `defaultCategory` that is not one of them.
                Additive and optional: a caller treats it as absent until Project sends it. Coordinator's decision of
                15 November 2026.
            goneProductIds:
              type: array
              items: {type: string}
              description: >-
                Catalog 0.3.0 (README "Products to show (data binding)"): the `productIds` held by the draft's
                ProductCards and AllProducts blocks that are not (any longer) products of this website (in its catalog
                and not archived), each once, in document order. AI Codegen gives it to the skills with `categories`
                as `catalog`, for /check's "picked product that no longer exists". Additive and optional, like
                `categories`; both are best-effort: left out when the catalog does not answer.
      errors:
        - '404 PROJECT_NOT_FOUND: unknown or deleted. A suspended website is still answered.'
    - route: PUT /internal/v1/projects/{projectId}/page/draft
      x-phase: 3
      status: ACCEPTED by ai_codegen (as above)
      callers: [ai-codegen-service]
      purpose: |
        The AI chat applies a change set to the website's draft, so the editor shows it. AI Codegen checks the owner
        first (POST /internal/v1/access-checks, manage_site); userId is recorded as the actor only, never authorization.
      body:
        type: object
        required: [draft, expectedEditRevision, changeSetId, userId]
        properties:
          draft: {type: object, description: The new Puck document of the home page.}
          expectedEditRevision: {type: integer, minimum: 0}
          changeSetId: {type: string, format: uuid, description: Idempotency key of the save.}
          userId: {type: string, format: uuid}
          componentCatalogVersion:
            type: string
            description: |
              Optional (catalog 0.2.0; sent only once Project accepts it). The editor catalog AI Codegen built the change set with; the same rules
              as on the owner's PUT /projects/{projectId}/page (absent = the stored version; never older than it).
      answer:
        status: 200
        description: The same changeSetId again answers the first save's 200, even if the page moved on since.
        schema:
          type: object
          required: [editRevision, updatedAt]
          properties:
            editRevision: {type: integer}
            updatedAt: {type: string, format: date-time}
      errors:
        - >-
          400 VALIDATION_FAILED: a bad body; or, from catalog 0.3.0, the draft breaks the component catalog, with field
          codes VALUE_INVALID / PUCK_TREE_INVALID (README "Refusals in 0.3.0"). A page checked against 0.1.0 or 0.2.0
          is refused as before: 400 PUCK_TREE_INVALID with field errors.
        - >-
          The 0.3.0 field errors (catalog 0.3.0 DRAFT; README "Refusals in 0.3.0"), as on the owner's
          PUT /projects/{projectId}/page: each names `content[i].<Type>.<prop>`, or
          `content[i].<Type>.<slot>[j].<Type>.<prop>` for a nested block (e.g.
          `content[2].Columns.column1[0].Buttons.items[1].link`), or `root.<prop>` (e.g. `root.facebookUrl` for a
          WhatsApp link), with code `VALUE_INVALID` for a value (a ProductCards or AllProducts `productIds` entry that
          is not a product of this website included: `content[i].<Type>.productIds[j]`) or `PUCK_TREE_INVALID` for the
          structure (depth, slot rules, placement, budgets, repeated block ids, `zones`). Without a single prop: a
          rich text rule names `content[i].RichText.body`; a budget names `content`; `maxPerPage` the first block over
          the limit; a repeated block id the second block, with `.id`; a repeated or reserved anchor the Section's
          `anchorId`; `zones` is `zones` ("first" and "second" in document order, depth first).
        - '404 PROJECT_NOT_FOUND.'
        - '409 STALE_EDIT_REVISION: the draft moved on; 409 IDEMPOTENCY_KEY_REUSED: a used changeSetId with another body.'
        - '422 PROJECT_READ_ONLY: the website is suspended or deleted.'

servers:
  - url: /api/project/v2
security:
  - bearer: []
tags:
  - name: templates
  - name: websites
  - name: subdomains
  - name: business-info
  - name: products
  - name: page
  - name: media
  - name: activity
  - name: deployments
  - name: sites
  - name: admin

paths:
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: The template gallery.
      security: []
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/templates", "GET /api/v1/templates"]
      parameters:
        - name: category
          in: query
          description: |
            One of the UI's categories (CLOTHES, FOOD_BEVERAGES, TECHNOLOGY, HANDMADE), as the UI's filter sends it, or a
            business type code (`clothing_shop`, ...; templates for any business type `*` always match). The gallery is
            the UI's eight templates (owner decision of 10 November 2026); the internal `blank` template is not listed.
          schema: {type: string, maxLength: 50}
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          schema: {type: string, examples: ["name,asc"]}
      responses:
        '200':
          description: One page of templates.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplatePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /templates/{templateId}:
    get:
      tags: [templates]
      operationId: getTemplate
      summary: One template with its starter page.
      security: []
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/templates/{templateId}", "GET /api/v1/templates/{templateCode}"]
      parameters:
        - $ref: '#/components/parameters/templateId'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /templates/{templateId}/site:
    get:
      tags: [templates]
      operationId: getTemplateSite
      summary: The full content of a template's demo site.
      description: |
        Owner decision of 10 November 2026 (DECISIONS.md Project 1): Project serves it. The body is the UI's
        `TemplateSite` (`src/features/template-sites/types/index.ts`): `slug` is the template's style key, `content`
        the bespoke design's sample content (everyday-store, sweet-pastel, warm-bold, clean-mono) or, for a page
        template (jackets, keyboards, iced-coffee, plates), its starter page document.
      security: []
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/templateId'
      responses:
        '200':
          description: The demo site.
          content:
            application/json:
              schema:
                type: object
                required: [slug, content]
                properties:
                  slug: {type: string}
                  content: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}

  /business-types:
    get:
      tags: [websites]
      operationId: listBusinessTypes
      summary: The active business type names, for the "Use template" form.
      security: []
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/business-types", "GET /api/v1/business-types"]
      responses:
        '200':
          description: Names, in catalog order (a small fixed list, so a bare array).
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
  /business-types/{code}:
    get:
      tags: [websites]
      operationId: getBusinessType
      summary: One business type with its product types and fields.
      security: []
      x-phase: 2
      x-replaces: ["GET /api/v1/business-types/{code}"]
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string, maxLength: 50}
      responses:
        '200':
          description: The business type, as v1 answers it inside `data`.
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}

  /subdomains/{name}/availability:
    get:
      tags: [subdomains]
      operationId: checkSubdomain
      summary: Is this sub-domain valid and free.
      description: |
        Always 200 for a name that is invalid, reserved or taken: `available` is false and `problem` says why.
        With `projectId` (owned by the caller), that website's own address counts as available.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/domains/check?name={name}", "GET /api/v1/subdomains/{subdomain}"]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string, maxLength: 63}
        - name: projectId
          in: query
          description: The caller's website the check is for. Another owner's id is treated as absent.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainCheck'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /projects:
    get:
      tags: [websites]
      operationId: listWebsites
      summary: The caller's websites.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/projects", "GET /api/v1/projects"]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/WebsiteStatus'}
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          description: "`updatedAt` (default, desc), `name`, `createdAt`."
          schema: {type: string}
      responses:
        '200':
          description: One page of websites.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageOfWebsite'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [websites]
      operationId: createWebsite
      summary: '"Use template": creates a website with its page and business details.'
      description: |
        The plan's website limit is checked with Payment (admission). A refusal the user lifts with a plan answers 402
        with its code (WEBSITE_LIMIT_REACHED, TRIAL_ENDED, NO_ACTIVE_PLAN, or WEBSITE_NOT_ADMITTED for a reason
        Payment adds later); an account an admin blocked answers 403 CLIENT_SUSPENDED, which no plan lifts (agreed
        with Payment, E2E phase A). v1 answers 422 for all five. Sending the same body again for a website that
        already exists answers 200 with it (no second website). `details.logoUrl` is the wizard's logo as a
        `data:image/...;base64,...` URL (the UI reads the chosen file into one) or null. It is checked before anything
        is created, as a media upload: PNG or JPEG read from the bytes (never the declared type), at most the
        website's image size limit (2 MiB by default, never more than 5 MiB) (400 VALIDATION_FAILED for anything else,
        413, 415). It becomes the website's first media asset and, once the
        catalog has registered the website, its business logo. The body may be up to 6 MiB. `category` and
        `thumbnailUrl` are ignored (the server owns them).
      x-phase: 2
      x-replaces: ["POST /api/v1/ui/projects", "PUT /api/v1/projects/{projectId}"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWebsiteBody'}
      responses:
        '201':
          description: Created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Website'}
        '200':
          description: The same website, created earlier by the same request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Website'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /projects/counts:
    get:
      tags: [websites]
      operationId: countWebsites
      summary: The caller's websites per status, for the tabs.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/projects/counts"]
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebsiteStatusCounts'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [websites]
      operationId: getWebsite
      summary: One of the caller's websites.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/projects/{projectId}", "GET /api/v1/projects/{projectId}"]
      responses:
        '200':
          description: The website.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Website'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [websites]
      operationId: updateWebsiteStatus
      summary: The owner suspends or switches back on their website.
      description: |
        `SUSPENDED` takes the website offline (content kept). `LIVE` switches a suspended website back on: it becomes
        LIVE when it was ever published, else DRAFT. Setting the status it already has answers 200 unchanged.
      x-phase: 2
      x-replaces: ["POST /api/v1/ui/projects/{projectId}/suspend", "POST /api/v1/ui/projects/{projectId}/reactivate"]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/WebsitePatch'}
          application/json:
            schema: {$ref: '#/components/schemas/WebsitePatch'}
      responses:
        '200':
          description: The website after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Website'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [websites]
      operationId: deleteWebsite
      summary: Deletes a website that was never deployed.
      x-phase: 2
      x-replaces: ["DELETE /api/v1/projects/{projectId}"]
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /projects/{projectId}/business-info:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [business-info]
      operationId: getBusinessInfo
      summary: A website's business details.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/projects/{projectId}/business-info"]
      responses:
        '200':
          description: The business details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [business-info]
      operationId: updateBusinessInfo
      summary: Saves the business details (creates them when missing).
      x-phase: 2
      x-replaces: ["PUT /api/v1/ui/projects/{projectId}/business-info"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BusinessInfoBody'}
