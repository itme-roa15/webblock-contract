  /projects/{projectId}/media:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [media]
      operationId: listMedia
      summary: The website's images.
      description: |
        Every image of the library: the owner's uploads and, since W8 (owner decision of 15 November 2026), Project's
        copies of the site template's images (`origin` TEMPLATE). The apps show both, the copies marked (owner, 15
        November 2026: "show them, marked"). Only uploads count toward the photo and storage limits.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/projects/{projectId}/media"]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: One page of images.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Uploads an image (PNG or JPEG, at most the website's image size limit, 2 MiB by default, never more than 5 MiB) to the website's library.
      description: |
        The type is read from the file's bytes, never from the client's content type or file name. The website owner's
        plan limits its photos (the library images the owner uploaded, `origin` UPLOAD): Project reads `photosLimit`
        from Payment's per-website entitlement before storing (never a number of its own), and a library already at
        the limit is 422 `PHOTO_LIMIT_REACHED` (owner decision of 14 November 2026; payment agent 76e8d818 agreed).
        When Payment does not answer clearly: 503 `PAYMENT_UNAVAILABLE` with `Retry-After`. The uploads' bytes are
        limited too (422 `STORAGE_LIMIT_REACHED`). TEMPLATE copies count toward neither limit (W8), so a client never
        compares listMedia's `totalItems` with `photosLimit`.
      x-phase: 2
      x-replaces: ["POST /api/v1/ui/projects/{projectId}/media"]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Stored.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAsset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/BusinessRule'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /projects/{projectId}/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - name: mediaId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Deletes a library image that nothing uses (with force=true, also one that only the page uses).
      description: |
        Owner only (owner decision of 14 November 2026). The image may be deleted only when nothing uses it: no
        product's photo, not the business logo, not the website's page (its draft), and no deployment that is live,
        restorable or still running. Otherwise 409 `MEDIA_IN_USE`, with at least one `errors[]` entry per place
        (`field` one of `products`, `businessLogo`, `pages`, `deployments`). Deleting an UPLOAD frees its photo and
        its bytes for new uploads at once; deleting a TEMPLATE copy (`MediaAsset.origin`) frees neither, as copies
        count toward no limit. The file is deleted from storage after the row. The apps call it after replacing or
        removing a photo. A suspended website is 422 `PROJECT_READ_ONLY`; the catalog not answering is 503
        `CATALOG_UNAVAILABLE`. A repeated DELETE of an image already deleted is 404 `MEDIA_NOT_FOUND`: the image is
        gone.

        The page's uses (W8b, owner decision of 15 November 2026). The page uses the image when a string anywhere in
        its `root.props` or in a block's props contains the image's storage key (the path part of `url` after the
        media host, `<projectId>/media/<file>`), the check Project makes today. Each use is one `pages` entry:
        - in an image field of a block: `blockId` (the block's `props.id`), `blockType` (its catalog type, e.g.
          `Hero`), `code` `MEDIA_IN_USE`;
        - in the page's own settings (`root.props.logoUrl`): `blockType` `root`, no `blockId`, `code` `MEDIA_IN_USE`;
        - anywhere else (a text, a link such as `facebookUrl`, an unknown prop): `code` `MEDIA_NAMED_IN_TEXT`, with
          `blockId` and `blockType` when it is inside a block (`blockType` `root` in the settings). It is never
          forced.
        - a use Project finds on the page but cannot tie to the settings or a block (e.g. a key the walk does not
          know): one `code` `MEDIA_NAMED_IN_TEXT` entry with neither `blockId` nor `blockType`. It is never forced.
        Blocks inside `zones` are walked like the page's own blocks. The image fields are: `root.props.logoUrl`; a
        block's `imageUrl` and `secondImageUrl`; and inside arrays `sideImages[].imageUrl`, `products[].imageUrl`,
        `images[].imageUrl` and `items[].photoUrl` (catalogs 0.1.0 and 0.2.0; a later catalog version lists its own
        image fields). One block using the image in several fields is one entry. A `pages` entry with `code`
        `MEDIA_IN_USE` and neither `blockId` nor `blockType` comes from a Project before W8b: name no block ("used on
        your page") and do not offer force.

        `force=true` deletes an image that only the page's image fields use, once the owner has confirmed in the app.
        In the same transaction Project sets each image field whose value contains the storage key to `null` (every
        image field is nullable in every catalog version), keeping arrays and their items, so item counts such as a
        Gallery's 2 to 12 images do not change and the blocks show no image instead of a broken one (a Gallery whose
        images are all null shows nothing on the published site). It then checks the page again: if the key is still
        anywhere, nothing is deleted or changed and the answer is the 409. The page gets a new edit revision, so an
        editor that saves with its old revision (`If-Match` or `expectedEditRevision`) gets the usual 412. `force`
        never overrides `products`, `businessLogo`, `deployments` or a `MEDIA_NAMED_IN_TEXT` use: with any of those,
        the answer is the same 409 with every entry, `pages` entries included. A client may offer force only when
        every `errors[]` entry is `field` `pages` with `code` `MEDIA_IN_USE` and a `blockType`. Clients send
        `force=true` only after the owner confirms that exact image's deletion, never in the automatic clean-up after
        replacing or removing a photo.

        Rollout: Project ships W8b before any client offers force. A Project before W8b ignores `force` and answers
        the same 409; clients can tell a W8b Project by `origin` on listMedia items.
      x-phase: 3
      parameters:
        - name: force
          in: query
          required: false
          description: |
            W8b (owner decision of 15 November 2026): `true` also deletes an image that only the page's image fields
            use, after the owner confirmed; those fields become `null`. Never forces `products`, `businessLogo`,
            `deployments` or a `MEDIA_NAMED_IN_TEXT` use. Absent or `false`: as before.
          schema: {type: boolean, default: false}
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Not the owner's website (PROJECT_NOT_FOUND), or no such image in it (MEDIA_NOT_FOUND).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BusinessRule'}
        '503': {$ref: '#/components/responses/Unavailable'}

