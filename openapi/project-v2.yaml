  /projects/{projectId}/deployments:
    parameters:
      - $ref: '#/components/parameters/projectId'
    post:
      tags: [deployments]
      operationId: startDeployment
      summary: Starts a deploy of the saved draft; it runs straight through to LIVE.
      description: |
        Creates the deployment (Project's generation request; its id is the deployment id). Code generation (AI
        Codegen), build and release (Provisioning) follow, and the release is promoted without a second call (owner
        decision of 10 November 2026). The same `Idempotency-Key` again answers 200 with the same deployment.

        Before anything is created, Project asks Payment whether this website may be deployed now
        (`GET /internal/v1/projects/{projectId}/entitlement`, payment-internal-v1.yaml getProjectEntitlement; owner
        decision of 11 November 2026: the trial allows one deploy in total). When Payment says no, nothing is created
        and no generation is spent: `402` with code `DEPLOY_LIMIT_REACHED` (publish `LIMIT_REACHED`), or, when the
        website's hosting `ENDED`, `TRIAL_ENDED`, `WEBSITE_NOT_ADMITTED` (reason `NOT_ADMITTED`) or `PLAN_REQUIRED`
        (any other reason). When Payment does not answer clearly: `503 PAYMENT_UNAVAILABLE` with `Retry-After`, never a
        deploy without the check. A replay of a known `Idempotency-Key` answers its deployment without asking again.
        The v1 deploy routes make the same check and answer these codes with `422`. Agreed with payment (agent
        76e8d818); Payment's generation admission refuses with `DEPLOY_LIMIT_REACHED` too, as a backstop.
      x-phase: 2
      x-replaces: ["POST /api/v1/ui/projects/{projectId}/deployments", "POST /api/v1/ui/projects/{projectId}/page/publish", "POST /api/v1/projects/{projectId}/generation-requests"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                subdomain:
                  type: [string, 'null']
                  description: The chosen address for a first deploy; null or absent for a redeploy.
      responses:
        '202':
          description: Accepted.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '200':
          description: The same deployment, started earlier with this Idempotency-Key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: The website's deployments, newest first; `?status=RUNNING&size=1` gives the one in progress.
      x-phase: 2
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/DeploymentStatus'}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: One page of deployments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/deployments/{deploymentId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - name: deploymentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: A deploy's progress (the UI polls it).
      description: |
        BUILD and PRODUCTS are Project's code generation. Once the source is published, the release half comes from
        Provisioning's GET /internal/v1/projects/{projectId}/releases?generationRequestId= (2 s): PACKAGE = BUILD,
        LAUNCH = ACCESS_SETUP and CANDIDATE, SSL done when PROMOTION succeeded, LIVE = PROMOTION; stage and status
        follow the release. When Provisioning does not answer, the deploy reads as Project knows it.
      x-phase: 2
      x-replaces: ["GET /api/v1/projects/{projectId}/generation-requests/{generationRequestId}", "GET /api/provisioning/v1/ui/projects/{projectId}/deployments/{deploymentId} (Provisioning)"]
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /sites/{projectId}/page:
    get:
      tags: [sites]
      operationId: getPublishedPage
      summary: Public read of a website's deployed page.
      security: []
      x-phase: 3
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: The published page document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageData'}
        '404':
          description: Unknown, never deployed, suspended or deleted (one answer for all, so nothing leaks).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /admin/projects:
    get:
      tags: [admin]
      operationId: adminListWebsites
      summary: Every owner's websites (admin table).
      description: |
        The owning service answers the full UI type (owner decision): owner name, email and avatar come from User;
        siteStatus, releaseStatus, routingStatus, liveRelease, lastDeployAt and sslValidUntil from Provisioning;
        plan, planEndsAt, productLimit, redeploysLeft and redeployLimit from Payment, each through an internal route
        with a timeout (User's GET /internal/v1/users?id=, Provisioning's GET /internal/v1/websites?id=, Payment's GET
        /internal/v1/clients/entitlements?clientUserId=). A part another service does not answer is `null` (siteStatus
        then derived from Project's status); the page never fails for it. The `site`, `release` and `plan` filters are
        not served yet (Provisioning's and Payment's filter routes come later).
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/admin/projects"]
      parameters:
        - $ref: '#/components/parameters/q'
        - name: ownerId
          in: query
          schema: {type: string, format: uuid}
        - name: ids
          in: query
          description: Comma-separated project ids.
          schema: {type: string}
        - name: site
          in: query
          x-phase: 3
          schema: {$ref: '#/components/schemas/SiteStatus'}
        - name: release
          in: query
          x-phase: 3
          schema: {$ref: '#/components/schemas/ReleaseStatus'}
        - name: plan
          in: query
          x-phase: 3
          schema: {$ref: '#/components/schemas/PlanCode'}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          schema: {type: string}
      security:
        - bearer: [ADMIN]
      responses:
        '200':
          description: One page of websites.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminWebsitePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/projects/counts:
    get:
      tags: [admin]
      operationId: adminCountWebsites
      summary: Websites per status, platform-wide.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/admin/projects/counts"]
      security:
        - bearer: [ADMIN]
      responses:
        '200':
          description: Counts, as v1 answers them.
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [admin]
      operationId: adminGetWebsite
      summary: One website (admin popup).
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/admin/projects/{projectId}"]
      security:
        - bearer: [ADMIN]
      responses:
        '200':
          description: The website.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminWebsite'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [admin]
      operationId: adminUpdateWebsiteStatus
      summary: The admin takes a website offline or brings it back.
      description: |
        `SUSPENDED` suspends the website and its hosting; `ONLINE` brings it back (409 while the owner's account is
        suspended). Project records it and tells Provisioning (hosting) through an internal command; audit
        SUSPEND_HOSTING / RESUME_HOSTING.
      x-phase: 3
      x-built: Provisioning's PUT /internal/v1/projects/{projectId}/hosting, the admin's user id as x-user-id
      x-replaces: ["POST /api/provisioning/v1/ui/admin/projects/{projectId}/suspend (Provisioning)", "POST /api/provisioning/v1/ui/admin/projects/{projectId}/resume (Provisioning)"]
      security:
        - bearer: [ADMIN]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [siteStatus]
              additionalProperties: false
              properties:
                siteStatus: {type: string, enum: [SUSPENDED, ONLINE]}
      responses:
        '200':
          description: The website after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminWebsite'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /admin/projects/{projectId}/generation-requests:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [admin]
      operationId: adminListProjectGenerationRequests
      summary: One website's generation requests.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/admin/projects/{projectId}/generation-requests"]
      security:
        - bearer: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          schema: {type: string}
      responses:
        '200':
          description: One page, items as v1 answers them.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/generation-requests:
    get:
      tags: [admin]
      operationId: adminListGenerationRequests
      summary: Every website's generation requests.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/admin/generation-requests"]
      security:
        - bearer: [ADMIN]
      parameters:
        - name: latestPerProject
          in: query
          schema: {type: boolean}
        - name: status
          in: query
          schema: {type: string}
        - name: updatedBefore
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          schema: {type: string}
      responses:
        '200':
          description: One page, items as v1 answers them.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/audit-events:
    get:
      tags: [admin]
      operationId: adminListAuditEvents
      summary: Project's own audit events.
      description: |
        Project's part of the audit log, as v1. The single admin activity feed (entries from User, Payment and
        Provisioning) waits for the owner (COMMON 3a) and is not this route.
      x-phase: 2
      x-replaces: ["GET /api/v1/ui/admin/audit"]
      security:
        - bearer: [ADMIN]
      parameters:
        - name: action
          in: query
          schema: {type: string}
        - name: actorUserId
          in: query
          schema: {type: string, format: uuid}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token, audience `project`. `ADMIN` = the top-level `roles` claim holds ADMIN.

  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      description: The website (project) id.
      schema: {type: string, format: uuid}
    templateId:
      name: templateId
      in: path
      required: true
      description: The template code, e.g. `everyday_store`.
      schema: {type: string, maxLength: 50}
    q:
      name: q
      in: query
      description: Search text.
      schema: {type: string, maxLength: 100}
    page:
      name: page
      in: query
      description: Zero-based page number.
      schema: {type: integer, minimum: 0, default: 0}
    size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 20}

  headers:
    Location:
      description: The created resource's path under `/api/project/v2`.
      schema: {type: string}
    ETag:
      description: The page's edit revision as a strong entity tag, e.g. `"7"`.
      schema: {type: string}

  responses:
    BadRequest:
      description: Invalid input (field errors in `errors`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: No token, or a bad one.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Not allowed (admin role missing, not in the plan, or the account an admin blocked).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Unknown, or not the caller's.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Conflicts with the current state (duplicate name, already deploying, not deletable, ...).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: "`If-Match` names an older revision: the page changed meanwhile."
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PlanRequired:
      description: The plan does not allow it.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BusinessRule:
      description: A business rule refuses it (unknown category, plan's product limit).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: A dependency (Payment, storage, the database) is down; `Retry-After` when known.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri, examples: ['urn:webblock:problem:project-not-found']}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, examples: [PROJECT_NOT_FOUND]}
        requestId: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              code: {type: string}
              blockId:
                type: string
                description: |
                  Optional (W8b): on deleteMedia's 409 `pages` entries, the page block that uses the image (its
                  `props.id`). Absent for a use in the page's settings, and everywhere else.
              blockType:
                type: string
                description: |
                  Optional (W8b): on deleteMedia's 409 `pages` entries, the block's catalog type (e.g. `Hero`,
                  `Gallery`), or `root` for the page's own settings. Clients show their own label for the type, or a
                  generic one ("a block on your page") for a type they don't know.

    TemplateCategory:
      type: string
      enum: [CLOTHES, FOOD_BEVERAGES, TECHNOLOGY, HANDMADE]
    TemplatePreviewImage:
      type: object
      required: [url, width, height]
      properties:
        url: {type: string}
        width: {type: integer}
        height: {type: integer}
    Template:
      type: object
      required: [id, name, description, category, thumbnailUrl, categories]
      properties:
        id: {type: string, description: The template code.}
        name: {type: string}
        description: {type: string}
        category:
          description: |
            Always one of the UI's four categories (its CategoryBadge has no case for anything else): from the template's
            first business type (clothing_shop -> CLOTHES, food_shop -> FOOD_BEVERAGES, tech_shop -> TECHNOLOGY,
            beauty_shop and furniture_shop -> HANDMADE); HANDMADE for a template that fits any business type (`*`).
          $ref: '#/components/schemas/TemplateCategory'
        categories:
          type: array
          description: Business type codes the template fits; `*` = any.
          items: {type: string}
        thumbnailUrl: {type: string}
        badge: {type: [string, 'null']}
        previews:
          type: [object, 'null']
          properties:
            desktop: {$ref: '#/components/schemas/TemplatePreviewImage'}
    TemplateDetail:
      allOf:
        - $ref: '#/components/schemas/Template'
        - type: object
          properties:
            styleKey: {type: string}
            version: {type: string}
            page:
              type: object
              description: The starter page (`puckTree`).
    TemplatePage:
      $ref: '#/components/schemas/PageOfTemplate'
    PageOfTemplate:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Template'}}
        page: {type: integer}
        size: {type: integer}
        totalItems: {type: integer}

    WebsiteStatus:
      type: string
      enum: [LIVE, DRAFT, SUSPENDED]
    Website:
      type: object
      description: The UI's Website, plus `editRevision` and `hasUndeployedChanges` for the editor.
      required: [id, name, category, status, templateId, updatedAt, editRevision, hasUndeployedChanges]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        businessType: {type: [string, 'null'], description: The business type's display name.}
        category:
          description: |
            One of the UI's four categories: the business type's (as for templates), else the template's, else
            HANDMADE. Never null (v1 answers the business type code here; v2 does not).
          $ref: '#/components/schemas/TemplateCategory'
        status: {$ref: '#/components/schemas/WebsiteStatus'}
        domain: {type: [string, 'null'], description: Public host; null until the first deploy.}
        templateId: {type: string}
        thumbnailUrl: {type: [string, 'null']}
        logoUrl:
          type: [string, 'null']
          description: |
            The business logo's public URL (the business details' logo), null when there is none or the catalog cannot
            be read. Added for the owner apps (mobile mapping G4).
        updatedAt: {type: string, format: date-time}
        suspendedAt: {type: [string, 'null'], format: date-time}
        reactivatedAt: {type: [string, 'null'], format: date-time}
        editRevision: {type: integer}
        hasUndeployedChanges: {type: boolean}
    PageOfWebsite:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Website'}}
        page: {type: integer}
        size: {type: integer}
        totalItems: {type: integer}
    WebsiteStatusCounts:
      type: object
      required: [ALL, LIVE, DRAFT, SUSPENDED]
      properties:
        ALL: {type: integer}
        LIVE: {type: integer}
        DRAFT: {type: integer}
        SUSPENDED: {type: integer}
    WebsitePatch:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [LIVE, SUSPENDED]}
    OpeningHour:
      type: object
      required: [day, open, opensAt, closesAt]
      properties:
        day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
        open: {type: boolean}
        opensAt: {type: string, pattern: '^\d{2}:\d{2}$'}
        closesAt: {type: string, pattern: '^\d{2}:\d{2}$'}
    CreateWebsiteBody:
      type: object
      description: The UI's CreateWebsiteBody (webblock-web-ui src/features/websites/api.ts), as v1 takes it.
      required: [name, templateId, businessType, details]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        templateId: {type: string, minLength: 1, maxLength: 100, description: A template code from GET /templates.}
        businessType:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            The business type's name, exactly as GET /business-types lists it (for example "Food & Beverage"). Missing
            or blank is 400 VALIDATION_FAILED (businessType FIELD_REQUIRED); an unknown or retired name is refused too.
        category: {type: string, maxLength: 100, description: Ignored (the server derives it).}
        thumbnailUrl: {type: string, maxLength: 2000, description: Ignored (the template's thumbnail is used).}
        details:
          type: object
          properties:
            businessName: {type: string, maxLength: 255}
            businessType: {type: string, maxLength: 255, description: Accepted and ignored; the top-level businessType counts.}
            description: {type: string}
            logoUrl: {type: [string, 'null'], description: 'A data:image/...;base64 URL of the logo, or null.'}
            phone: {type: string}
            email: {type: string}
            address: {type: string}
            hours: {type: array, items: {$ref: '#/components/schemas/OpeningHour'}}

    DomainCheck:
      type: object
      required: [name, host, available, problem]
      properties:
        name: {type: string}
        host: {type: string}
        available: {type: boolean}
        problem: {type: [string, 'null']}

    BusinessInfo:
      type: object
      required: [websiteId, description, logoUrl, phone, email, address, mapsUrl, hours, updatedAt]
      properties:
        websiteId: {type: string, format: uuid}
        description: {type: string}
        logoUrl: {type: [string, 'null']}
        phone: {type: string}
        email: {type: string}
        address: {type: string}
        mapsUrl: {type: [string, 'null']}
        hours: {type: array, minItems: 7, maxItems: 7, items: {$ref: '#/components/schemas/OpeningHour'}}
        updatedAt: {type: string, format: date-time}
    BusinessInfoBody:
      type: object
      description: As v1's PUT body. `logoUrl` absent keeps the logo; it must be one of the website's media URLs.
      properties:
        description: {type: string}
        logoUrl: {type: [string, 'null']}
        phone: {type: string}
        email: {type: string}
        address: {type: string}
        mapsUrl: {type: [string, 'null']}
        hours: {type: array, items: {$ref: '#/components/schemas/OpeningHour'}}

    Product:
      type: object
      description: The UI's Product, plus `version` for optimistic locking.
      required: [id, websiteId, name, description, category, price, imageUrl, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        websiteId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        category: {type: string}
        price: {type: [string, 'null'], description: 'Decimal string, e.g. "6.00"; null when hidden.'}
        imageUrl: {type: [string, 'null']}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProductBody:
      type: object
      description: |
        As v1, except the price. `imageUrl` absent keeps the photo; `version` optional. `price` absent or null is a hidden
        price (stored empty, read back as null; mobile mapping G7); v1 still requires it.
      required: [name, category]
      properties:
        name: {type: string}
        description:
          type: [string, 'null']
          description: |
            Optional. Absent, null, "" or whitespace only is no description (stored empty; Product.description reads
            ""). Otherwise trimmed and 10 to 300 characters (400 VALIDATION_FAILED, FIELD_LENGTH_INVALID on
            `description`). v1 still requires it (Android finding of 14 November 2026).
        category: {type: string}
        price:
          type: [string, 'null']
          description: Up to 6 digits, optionally 1 or 2 decimals (for example "3.50"); null or absent is a hidden price.
        imageUrl:
          type: [string, 'null']
          description: |
            Absent, or the current photo's URL, keeps the photo; null removes it; otherwise exactly the `url` of one of
            this website's media library images (`GET .../media`). Any other value is 400 VALIDATION_FAILED, code
            VALUE_INVALID on `imageUrl`. A removed or replaced photo stays in the media library.
        version: {type: integer}
    ProductPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Product'}}
        page: {type: integer}
        size: {type: integer}
        totalItems: {type: integer}
    ProductCounts:
      type: object
      required: [total, categories]
      properties:
        total: {type: integer}
        categories:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category: {type: string}
              count: {type: integer}

    PageData:
      type: object
      description: The Puck document of one page (`Data<BlockProps, SiteRootProps>` in the UI).
    WebsitePage:
      type: object
      required: [websiteId, draft, published, updatedAt, publishedAt, editRevision]
      properties:
        websiteId: {type: string, format: uuid}
        draft: {$ref: '#/components/schemas/PageData'}
        published:
          oneOf:
            - $ref: '#/components/schemas/PageData'
            - type: 'null'
        updatedAt: {type: string, format: date-time}
        publishedAt: {type: [string, 'null'], format: date-time}
        editRevision: {type: integer}
    PageVersion:
      type: object
      required: [id, publishedAt, current]
      properties:
        id: {type: string, format: uuid}
        publishedAt: {type: string, format: date-time}
        current: {type: boolean}

    MediaAsset:
      type: object
      required: [id, url, name]
      properties:
        id: {type: string, format: uuid}
        url: {type: string}
        name: {type: string}
        origin:
          type: string
          enum: [UPLOAD, TEMPLATE]
          description: |
            Optional (W8b, owner decision of 15 November 2026: "show them, marked"). UPLOAD: a file the owner
            uploaded. TEMPLATE: Project's copy of a site template image, made for this website when it was created,
            by the W8 backfill, or when a version deployed before W8 is restored (so a deleted copy can come back);
            copies may be WebP. The apps mark it ("From your template"). TEMPLATE copies count toward neither the
            photo limit (`photoCount`, Payment's `photosLimit`) nor the storage limit. Absent (an older Project):
            treat as UPLOAD. Clients treat an unknown value as UPLOAD too.
    MediaPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MediaAsset'}}
        page: {type: integer}
        size: {type: integer}
        totalItems: {type: integer}

    ActivityEvent:
      type: object
      required: [id, websiteId, type, outcome, title, detail, occurredAt]
      properties:
        id: {type: string, format: uuid}
        websiteId: {type: string, format: uuid}
        type: {type: string, enum: [DEPLOY, PRODUCT, BUSINESS_INFO]}
        outcome: {type: string, enum: [SUCCEEDED, FAILED, CHANGED]}
        title: {type: string}
        detail: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
    ActivityPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ActivityEvent'}}
        page: {type: integer}
        size: {type: integer}
        totalItems: {type: integer}

    DeploymentStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED]
    Deployment:
      type: object
      description: |
        The UI's Deployment. `id` is Project's generation request id. Steps, in order: BUILD (code generation),
        PRODUCTS, PACKAGE (build), LAUNCH (deploy), SSL, LIVE (promoted). `stage` adds the owner's one-word stage
        (COMMON 3a): generating, building, deploying, live, failed.

        `percent` (B2, 17 Nov 2026) is weighted: each step has a share of the bar and a usual time, measured on AWS
        (BUILD 50 % / 49 s, PRODUCTS 0 % / none, PACKAGE 25 % / 80 s, LAUNCH 15 % / 46 s, SSL 0 % / none, LIVE 10 % /
        32 s; 207 s in all). The percent is the shares of the DONE steps plus, for each step that started and is not
        done, its share times min(0.9, seconds since its start / expectedSeconds) while RUNNING, and times 0.9 once
        FAILED. 100 only when SUCCEEDED, else at most 99. Along the newest deployment, as polled, it does not go down,
        except while Provisioning does not answer: then the stored state is shown (50 until the release outcome is
        known, or that outcome). Older rows of the list always show the stored state. Rare: the owner's DEPLOY of a
        failed release within a step's usual time reads by time again, below the FAILED read.
      required: [id, websiteId, kind, status, percent, secondsLeft, domain, steps, startedAt, finishedAt]
      properties:
        id: {type: string, format: uuid}
        websiteId: {type: string, format: uuid}
        kind: {type: string, enum: [FIRST, REDEPLOY]}
        status: {$ref: '#/components/schemas/DeploymentStatus'}
        stage: {type: string, enum: [generating, building, deploying, live, failed]}
        percent: {type: integer, minimum: 0, maximum: 100}
        secondsLeft: {type: [integer, 'null']}
        domain: {type: [string, 'null'], description: Public host the site goes live on; null while not chosen.}
        steps:
          type: array
          items:
            type: object
            required: [key, status, seconds, startedAt, expectedSeconds]
            properties:
              key: {type: string, enum: [BUILD, PRODUCTS, PACKAGE, LAUNCH, SSL, LIVE]}
              status: {type: string, enum: [DONE, IN_PROGRESS, UP_NEXT, WAITING, FAILED, NOT_STARTED]}
              seconds: {type: [integer, 'null']}
              startedAt:
                type: [string, 'null']
                format: date-time
                description: |
                  B2: when the step began (UTC), null until it starts or when unknown. BUILD: the deploy's start, once
                  the request left captured; PRODUCTS: the same, once DONE. PACKAGE: the release build's first attempt. LAUNCH:
                  the earlier of ACCESS_SETUP and CANDIDATE. LIVE: PROMOTION's first attempt. SSL: LIVE's start once
                  SSL is DONE. A retried step keeps its first attempt's start.
              expectedSeconds:
                type: [integer, 'null']
                description: |
                  B2: the step's usual time in seconds (the medians in the Deployment description), null for a step
                  without a time of its own (PRODUCTS, SSL).
        startedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    DeploymentPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Deployment'}}
        page: {type: integer}
        size: {type: integer}
        totalItems: {type: integer}

    PlanCode:
      type: string
      enum: [FREE_TRIAL, PLUS, PRO, ULTRA]
    SiteStatus:
      type: string
      enum: [ONLINE, NOT_DEPLOYED, OFFLINE_BILLING, SUSPENDED]
    ReleaseStatus:
      type: string
      enum: [LIVE, GOING_LIVE, FAILED]
    AdminWebsite:
      type: object
      description: |
        The UI's AdminWebsite. Project's own fields are always there; the fields of other services are null when that
        service did not answer (or, in phase 2, is not asked yet). `hasUndeployedChanges` is added on the single read.
      required: [id, name, ownerId]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        domain: {type: [string, 'null']}
        thumbnailUrl: {type: [string, 'null']}
        logoUrl: {type: [string, 'null']}
        templateSlug: {type: string}
        ownerId: {type: string, format: uuid}
        ownerName: {type: [string, 'null'], description: From User.}
        ownerEmail: {type: [string, 'null'], description: From User.}
        ownerAvatarUrl: {type: [string, 'null'], description: From User.}
        siteStatus:
          description: From Provisioning (and Payment for OFFLINE_BILLING); phase 2 derives it from Project's status.
          oneOf:
            - $ref: '#/components/schemas/SiteStatus'
            - type: 'null'
        releaseStatus:
          description: From Provisioning; null when never deployed.
          oneOf:
            - $ref: '#/components/schemas/ReleaseStatus'
            - type: 'null'
        routingStatus: {type: [string, 'null'], enum: [STABLE, UPDATING, null]}
        lastDeployAt: {type: [string, 'null'], format: date-time}
        liveRelease: {type: [string, 'null']}
        plan:
          description: From Payment.
          oneOf:
            - $ref: '#/components/schemas/PlanCode'
            - type: 'null'
        planEndsAt: {type: [string, 'null'], format: date-time}
        productCount: {type: [integer, 'null']}
        productLimit: {type: [integer, 'null']}
        redeploysLeft: {type: [integer, 'null']}
        redeployLimit: {type: [integer, 'null']}
        sslValidUntil: {type: [string, 'null'], format: date-time}
        hasUndeployedChanges: {type: boolean}
    AdminWebsitePage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminWebsite'}}
        page: {type: integer}
        size: {type: integer}
        totalItems: {type: integer}
    ObjectPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: {type: array, items: {type: object}}
        page: {type: integer}
