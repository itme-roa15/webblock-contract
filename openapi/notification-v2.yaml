openapi: 3.1.0
info:
  title: WebBlock Notification API v2
  version: 2.0.0
  description: |
    OWNED BY notification.

    Public API of notification-service, version 2 (owner's decision, 10 November 2026). It replaces the v1 `ui/`
    routes, which stay unchanged and deprecated until every client has moved. The UI's TypeScript types are the
    contract for every answer (`webblock-web-ui/src/features/{notifications,support,landing,admin}/types.ts`).

    Rules for every operation:
    - Authentication is a Keycloak bearer JWT. The caller is `sub`; no operation takes a user id from the path or body.
    - `/admin/...` requires the realm role `admin`.
    - Lists are `Page<T>` (`items`, zero-based `page`, `size`, `totalItems`). Sort is newest first only.
    - Errors are RFC 9457 problem details with `type` = `urn:webblock:problem:<code>`.
    - Ids from Knock (notification ids) are opaque strings, not UUIDs. Project ids are UUIDs.
    - Times are ISO 8601 in UTC.

    Outbound providers: Knock (`api.knock.app`) for feeds and delivery; email goes through Knock to Resend.
servers:
  - url: /api/notification/v2
tags:
  - name: me
    description: The signed-in owner's own notifications.
  - name: admin
    description: Admin-only routes. Realm role `admin` required.
  - name: support
    description: Support topics, FAQ and support messages for signed-in users.
  - name: public
    description: No token.
security:
  - bearerAuth: []
paths:
  /me/notifications:
    get:
      tags: [me]
      operationId: listMyNotifications
      summary: The signed-in user's notifications, newest first
      x-replaces: "GET /api/notification/v1/ui/notifications"
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: One page of the user's in-app feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      tags: [me]
      operationId: updateMyNotifications
      summary: Mark all of the signed-in user's notifications read
      description: 'Bulk update of the collection. Only `{"read": true}` is supported; `false` answers 422.'
      x-replaces: "POST /api/notification/v1/ui/notifications/read-all"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadUpdate'
      responses:
        '204': { description: Every notification in the user's feed is read. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/notifications/{notificationId}:
    parameters:
      - $ref: '#/components/parameters/notificationId'
    patch:
      tags: [me]
      operationId: updateMyNotification
      summary: Mark one of the signed-in user's notifications read
      description: |
        Gap G6, requested by the coordinator for the mobile owner app (14 Nov 2026). Only `{"read": true}` is
        supported; `false` answers 422. The notification must be in the caller's own feed: any other id answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadUpdate'
      responses:
        '200':
          description: The notification, now read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/notifications:
    get:
      tags: [admin]
      operationId: listAdminNotifications
      summary: The admin's notifications, newest first
      x-replaces: "GET /api/notification/v1/ui/admin/notifications"
      parameters:
        - name: unread
          in: query
          description: true for unread only, false for read only, absent for all.
          schema: { type: boolean }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: One page of the admin feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      tags: [admin]
      operationId: updateAdminNotifications
      summary: Mark all of the admin's notifications read
      description: 'Bulk update of the collection. Only `{"read": true}` is supported; `false` answers 422.'
      x-replaces: "POST /api/notification/v1/ui/admin/notifications/read-all"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadUpdate'
      responses:
        '204': { description: Every notification in the admin feed is read. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/notifications/counts:
    get:
      tags: [admin]
      operationId: countAdminNotifications
      summary: Counts for the admin bell
      x-replaces: "GET /api/notification/v1/ui/admin/notifications/unread-count"
      responses:
        '200':
          description: The unread count. v1 answered a bare number; v2 answers an object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCounts'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/notifications/{notificationId}:
    parameters:
      - $ref: '#/components/parameters/notificationId'
    patch:
      tags: [admin]
      operationId: updateAdminNotification
      summary: Mark one admin notification read
      description: |
        Only `{"read": true}` is supported; `false` answers 422. The notification must be in the caller's own
        admin feed: an id from someone else's feed answers 404.
      x-replaces: "POST /api/notification/v1/ui/admin/notifications/{id}/read"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadUpdate'
      responses:
        '200':
          description: The notification, now read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotification'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/projects/{projectId}/owner-messages:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      operationId: sendOwnerMessage
      summary: Email a website's owner
      description: |
        The owner is found through project-service (project owner) and user-service (contact). The message is handed
        to the Knock workflow configured as `KNOCK_WF_CONTACT_OWNER`, which emails the owner.

        Answers 204, not 201: the message is not stored here and there is no resource to read back, so there is no
        `Location`. A repeat with the same `Idempotency-Key` is delivered once.

        503 with type `urn:webblock:problem:knock-workflow-missing` names the missing workflow: either
        `KNOCK_WF_CONTACT_OWNER` is not set, or Knock has no workflow with the configured key. The README lists the
        setup steps.
      x-replaces: "POST /api/notification/v1/ui/admin/projects/{projectId}/contact-owner"
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerMessageRequest'
      responses:
        '204': { description: The message was handed to Knock. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/activity:
    get:
      tags: [admin]
      operationId: listAdminActivity
      summary: The admin activity log (hosting, users, plans), newest first
      description: |
        One feed from four services (owner's decision of 10 November 2026). Each entry comes from
        `events/audit/audit_recorded.v1` (account, payment, provisioning, project); an action that moves from QUEUED to
        SUCCEEDED or FAILED is one entry showing its latest result. The names come from the producer at the time of the
        action. `actor`: `admins` = any admin, `system` = automatic actions, anything else = one admin's email.
      x-replaces: "GET /ui/admin/audit in user-service, payment-service and provisioning-service (three separate v1 feeds)"
      parameters:
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/ActivityAction' }
        - name: actor
          in: query
          schema: { type: string, minLength: 1, maxLength: 254 }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          description: 'createdAt (default, desc), action, targetName, actorEmail or result, each with ,asc or ,desc.'
          schema: { type: string, default: 'createdAt,desc', pattern: '^(createdAt|action|targetName|actorEmail|result),(asc|desc)$' }
      responses:
        '200':
          description: One page of the activity log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEntryPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/activity/actors:
    get:
      tags: [admin]
      operationId: listAdminActivityActors
      summary: Admin emails that appear in the activity log (for the actor filter)
      description: A small list, so a plain array (the UI type is `string[]`), sorted.
      responses:
        '200':
          description: Distinct admin emails, sorted.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /contact-messages:
    post:
      tags: [public]
      operationId: sendContactMessage
      summary: Public contact form
      description: |
        Public: no token. Rate-limited per client address (429 with `Retry-After`). The body is validated strictly
        (length, a letter in the message, at most a few links), so the form cannot be used to relay spam.
        No `Location`: a contact message cannot be read back through the public API.
      x-replaces: "POST /api/notification/v1/ui/contact"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageRequest'
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /support/topics:
    get:
      tags: [support]
      operationId: listSupportTopics
      summary: Topics of the support form
      description: A small fixed list, so a plain array (the UI type is `SupportTopic[]`).
      x-replaces: "GET /api/notification/v1/ui/support/topics"
      responses:
        '200':
          description: All topics.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportTopic' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /support/faq-items:
    get:
      tags: [support]
      operationId: listFaqItems
      summary: FAQ entries
      description: A small fixed list, so a plain array (the UI type is `FaqItem[]`). Needs a token, as in v1.
      x-replaces: "GET /api/notification/v1/ui/support/faq"
      responses:
        '200':
          description: All FAQ entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FaqItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /support/messages:
    post:
      tags: [support]
      operationId: sendSupportMessage
      summary: Send a support message
      description: |
        Stored with the caller's user id (from the token). Answers the message with its ticket number.
        No `Location`: support messages are not readable through this API yet.
      x-replaces: "POST /api/notification/v1/ui/support/messages"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportMessageRequest'
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token.

  parameters:
    page:
      name: page
      in: query
      description: Zero-based page number.
      schema: { type: integer, minimum: 0, maximum: 1000, default: 0 }
    size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    sort:
      name: sort
      in: query
      description: Only newest first is supported; anything else answers 400.
      schema: { type: string, enum: ['createdAt,desc'], default: 'createdAt,desc' }
    notificationId:
      name: notificationId
      in: path
      required: true
      description: Knock message id (opaque, not a UUID).
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }

  responses:
    BadRequest:
      description: Invalid input. `fieldErrors` names each invalid field.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No token, or a bad one.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller is not an admin.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not the caller's.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: 'Valid JSON that the operation does not support (for example `{"read": false}`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit reached. `Retry-After` gives the seconds to wait.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: A dependency (Knock, project-service, user-service, the database) is down or not configured.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: '`urn:webblock:problem:<code>`.'
          examples: ['urn:webblock:problem:knock-workflow-missing']
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    ReadUpdate:
      type: object
      additionalProperties: false
      required: [read]
      properties:
        read: { type: boolean }

    NotificationKind:
      type: string
      enum: [SUCCESS, WARNING, INFO]

    Notification:
      description: '`NotificationDto` in `src/features/notifications/types.ts`.'
      type: object
      required: [id, title, message, kind, websiteId, createdAt, read]
      properties:
        id: { type: string }
        title:
          type: string
          description: Who it is about, for example a website name or "WebBlock Billing".
        message: { type: string }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        websiteId:
          type: [string, 'null']
          format: uuid
          description: The website it is about; null for platform messages.
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        detail:
          type: [string, 'null']
          description: |
            Longer text for a detail screen, or null. Built from the data Notification sent with the Knock trigger
            (for example a failed deploy's failure code, the admin's subject and message for contact-owner, the amount
            and due date for payment due). Added 14 Nov 2026 for the mobile owner app (gap G5); optional, so older
            clients can ignore it.
        target: { $ref: '#/components/schemas/NotificationTarget' }

    NotificationTarget:
      description: |
        Where "Open" goes (gap G5, requested by the coordinator for the mobile owner app, 14 Nov 2026). Optional on
        Notification; always sent by this service.
      type: object
      required: [websiteId, tab, workflow]
      properties:
        websiteId:
          type: [string, 'null']
          format: uuid
          description: The website to open; the same as Notification.websiteId.
        tab:
          type: [string, 'null']
          enum: [MONITOR, PRODUCTS, BUSINESS_INFO, null]
          description: |
            The website screen to open: MONITOR for deploy results and website alerts, PRODUCTS for a finished
            generation. Null when there is no website or no screen for it (contact-owner, payment due). BUSINESS_INFO
            is reserved.
        workflow:
          type: string
          description: The Knock workflow key (for example deployment-succeeded), for clients that map more cases.

    NotificationPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }

    AdminNotificationKind:
      type: string
      description: |
        The UI's `NotificationKind` (admin) plus `SYSTEM_ALERT`, which the UI type does not have yet. Platform alerts
        from Alertmanager (generation stuck, website crashed, platform service down) have no other fitting kind.
      enum: [DEPLOY_FAILED, PLAN_EXPIRED, PAYMENT_PAST_DUE, TRIAL_ENDING, TRIAL_STARTED, REDEPLOY_REQUESTED,
             ACCOUNT_CREATED, PLAN_UPGRADED, SYSTEM_ALERT]

    AdminNotification:
      description: '`AdminNotification` in `src/features/admin/types.ts`.'
      type: object
      required: [id, kind, actorId, actorName, actorAvatarUrl, message, link, createdAt, readAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/AdminNotificationKind' }
        actorId:
          type: [string, 'null']
          description: |
            The user the event is about. Null for system events (alerts), where there is no user; the UI type says
            string, so the UI shows the system entry without an account link.
        actorName:
          type: string
          description: The user's name, or "System".
        actorAvatarUrl: { type: [string, 'null'] }
        message: { type: string }
        link:
          type: [string, 'null']
          description: Admin page to open, for example "/admin/websites?website=<id>".
        createdAt: { type: string, format: date-time }
        readAt:
          type: [string, 'null']
          format: date-time
          description: Null while unread.

    AdminNotificationPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminNotification' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }

    NotificationCounts:
      type: object
      required: [unread]
      properties:
        unread: { type: integer, format: int64, minimum: 0 }

    ActivityAction:
      type: string
      enum: [SUSPEND_HOSTING, RESUME_HOSTING, ROLLBACK, SUSPEND_USER, REACTIVATE_USER, CHANGE_PLAN]

    ActivityEntry:
      description: '`ActivityEntry` in `src/features/admin/monitoring/types.ts`.'
      type: object
      required: [id, action, targetName, targetDetail, actorEmail, result, createdAt]
      properties:
        id: { type: string, format: uuid, description: The audit event's activity_id. }
        action: { $ref: '#/components/schemas/ActivityAction' }
        targetName: { type: string }
        targetDetail: { type: string, description: 'Domain for websites, email for users.' }
        actorEmail: { type: [string, 'null'], description: Admin email, or null when the system did it. }
        result: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        createdAt: { type: string, format: date-time, description: When the action was asked for. }

    ActivityEntryPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityEntry' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }

    OwnerMessageRequest:
      type: object
      additionalProperties: false
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 3, maxLength: 100 }
        message: { type: string, minLength: 10, maxLength: 2000 }

    ContactMessageRequest:
      type: object
      additionalProperties: false
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: Letters, spaces and . ' ’ - only.
        email: { type: string, format: email, maxLength: 254 }
        message:
          type: string
          minLength: 10
          maxLength: 2000
          description: Must contain a letter, and at most 3 links.

    ContactMessage:
      description: '`ContactMessage` in `src/features/landing/types.ts`.'
      type: object
      required: [id, name, email, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    SupportTopic:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    FaqItem:
      type: object
      required: [id, question, answer]
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }

    SupportMessageRequest:
      type: object
      additionalProperties: false
      required: [from, topic, subject, message]
      properties:
        from: { type: string, format: email, maxLength: 254 }
        website:
          type: [string, 'null']
          maxLength: 255
          description: The website the message is about, or null for a general question.
        topic:
          type: string
          maxLength: 100
          description: A topic id from GET /support/topics (its label is accepted too, as the current UI sends it).
        subject: { type: string, minLength: 3, maxLength: 100 }
        message: { type: string, minLength: 10, maxLength: 2000 }

    SupportMessage:
      description: '`SupportMessage` in `src/features/support/types.ts`.'
      type: object
      required: [id, ticket, from, website, topic, subject, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticket:
          type: string
          description: Human-readable ticket number, for example "WB-20481".
        from: { type: string }
        website: { type: [string, 'null'] }
        topic: { type: string }
        subject: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
